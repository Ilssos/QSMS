<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QSMS">
<meta name="theme-color" content="#F3F2EE">
<title>Sistema QSMS Machine</title>
<style>
:root{
  --bg:#F3F2EE; --card:#fff; --ink:#1f2421; --muted:#6b706b; --line:#e3e1da;
  --ok:#2e7d4f; --warn:#d98e04; --bad:#c0392b; --info:#2f5d8a; --accent:#1f3d2f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4}
.hidden{display:none!important}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:380px}
.login h1{font-size:1.2rem;color:var(--accent)}
.login p{color:var(--muted);font-size:.85rem;margin:4px 0 18px}
.erro{color:var(--bad);font-size:.85rem;min-height:1.2em;margin-bottom:8px}

/* cabeçalho e navegação */
header{background:var(--accent);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header h1{font-size:1.1rem}
header small{opacity:.8;display:block;font-size:.78rem}
.hdr-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.8rem}
header .btn{background:rgba(255,255,255,.15);padding:6px 12px;font-size:.78rem}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px 20px;background:var(--bg);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
nav a{white-space:nowrap;cursor:pointer;color:var(--ink);background:var(--card);border:1px solid var(--line);padding:6px 14px;border-radius:99px;font-size:.85rem}
nav a.on{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:1200px;margin:0 auto;padding:20px}
h2{font-size:1rem;margin:26px 0 10px;color:var(--accent)}
h2:first-child{margin-top:0}

/* formulários e botões */
label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:12px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink);margin-top:4px}
textarea{resize:vertical}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;font-size:.88rem;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:4px 10px;font-size:.76rem;font-weight:500}
.btn:disabled{opacity:.6;cursor:wait}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:0 0 14px}
.toolbar label{margin:0;min-width:150px;flex:0 1 220px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:20}
.box{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:680px;margin:auto}
.box h3{margin-bottom:14px;color:var(--accent)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.fgrid .wide{grid-column:1/-1}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:.85rem;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#toast.err{background:var(--bad)}

/* cartões, kpis, tabelas */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi small{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
.kpi b{display:block;font-size:1.8rem;margin:4px 0 2px}
.kpi span{font-size:.75rem;color:var(--muted)}
.sec-fab{position:fixed;right:16px;bottom:16px;z-index:60;border-radius:999px;padding:12px 16px;box-shadow:0 4px 14px #0004}
.sec-fab .bd{background:#c62828;color:#fff;border-radius:999px;font-size:.7rem;padding:1px 6px;margin-left:6px}
.sec-box{position:fixed;right:16px;bottom:70px;width:min(380px,calc(100vw - 32px));height:min(520px,70vh);z-index:61;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px #0005;display:flex;flex-direction:column;overflow:hidden}
.sec-box.hidden{display:none}
.sec-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.sec-h b{flex:1}.sec-h small{color:var(--muted);font-size:.72rem}
.sec-log{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.sec-m{max-width:88%;padding:8px 10px;border-radius:12px;font-size:.88rem;white-space:pre-wrap;background:var(--bg,#eee)}
.sec-m.u{align-self:flex-end;background:#dbeafe;color:#102a43}
.sec-m .acs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sec-in{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
.sec-in textarea{flex:1;resize:none;height:42px}
.sec-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 6px}
.rec{background:#c62828 !important;color:#fff !important}
.iabox{margin:10px 0;padding:10px;border:1px dashed var(--line);border-radius:10px;background:var(--card)}
.iabox textarea{width:100%;margin:8px 0}
.iarow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.iarow label.btn{cursor:pointer;margin:0}
.iasug{outline:2px solid #7c5cff55;background:#f4f0ff !important}
.sug{display:block;font-size:.74rem;color:var(--muted);margin-top:3px}
.sug a,.sug button{margin-left:6px}
.cap{margin:8px 0 0;font-size:.78rem;color:var(--muted);text-align:center}
.kpi.ok b{color:var(--ok)} .kpi.warn b{color:var(--warn)} .kpi.bad b{color:var(--bad)}
.d{display:block;font-style:normal;font-size:.7rem;margin-top:3px;color:var(--muted)}
.d.up{color:var(--ok)} .d.dn{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;overflow-x:auto}
.card h3{font-size:.9rem;margin-bottom:10px;color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:.7rem;text-transform:uppercase}
td:first-child,th:first-child{text-align:left}
table.crud td,table.crud th{text-align:left}
td.txt{white-space:normal;min-width:200px;max-width:340px}
tr.total td{font-weight:700;background:#faf9f6}
.cont,.vazio{font-size:.78rem;color:var(--muted);margin-top:8px}
.nota{background:#eef3f8;border:1px solid #cbd9e8;color:#27486b;border-radius:10px;padding:10px 14px;font-size:.82rem;margin-bottom:14px}
.topo{margin:12px 20px 0;border:1px solid var(--line);border-left-width:8px;border-radius:12px;background:var(--card,#fff);padding:10px 14px}
.topo.bad{border-color:#e0a49b;border-left-color:var(--bad);background:#fdf1ef}.topo.warn{border-color:#f1d29a;border-left-color:var(--warn);background:#fff8ea}.topo.ok{border-color:#b5d9c1;border-left-color:var(--ok);background:#eef7f1}
.topo-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.9rem}.topo-b{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px 24px;margin-top:10px}
.topo-s h4{margin:0 0 4px;font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tg{display:inline-block;border-radius:99px;padding:3px 10px;font-size:.78rem;font-weight:700;color:#fff;background:var(--muted)}.tg.ok{background:var(--ok)}.tg.warn{background:var(--warn)}.tg.bad{background:var(--bad)}
.pills{display:flex;flex-wrap:wrap;gap:6px}.rp{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:4px 8px;font-size:.8rem;border:1px solid}.rp em{font-style:normal;opacity:.75}
.rp.ok{background:#e8f4ec;border-color:#b5d9c1;color:#1f5a37}.rp.warn{background:#fff4e0;border-color:#f1d29a;color:#7a5200}.rp.bad{background:#fdecea;border-color:#f2b8b0;color:#8a2218}
.vl{list-style:none;margin:0;padding:0;font-size:.82rem}.vl li{padding:2px 0 2px 10px;border-left:4px solid var(--warn);margin:3px 0}.vl li.bad{border-left-color:var(--bad)}
.lk{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}.lk:hover{text-decoration:underline}.vl2{list-style:none;margin:0 0 8px;padding:0;font-size:.85rem}.vl2 li{margin:3px 0}
.avrow{display:flex;align-items:center;gap:10px;margin:4px 0}.avl{width:230px;font-size:.85rem}.avrow .bar{flex:1}.avv{width:28px;text-align:right;font-weight:700}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%}
.stack{display:flex;height:14px;border-radius:6px;overflow:hidden;background:var(--line);min-width:140px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.75rem;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
.pill,.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.74rem;font-weight:600;color:#fff;background:var(--gray,#9aa09a)}
.chip.ok{background:var(--ok)} .chip.warn{background:var(--warn)} .chip.bad{background:var(--bad)} .chip.info{background:var(--info)}
.alert{background:#fff4e0;border:1px solid #f1d29a;color:#7a5200;border-radius:10px;padding:10px 14px;font-size:.85rem;margin-bottom:8px}
.alert.bad{background:#fdecea;border-color:#f2b8b0;color:#8a2218}
.alert.good{background:#e8f4ec;border-color:#b5d9c1;color:#1f5a37}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.chart{position:relative;height:270px}
.pir{width:100%;max-width:680px;color:var(--ink)}
.print-head{display:none}


/* fotos, arquivos, galeria */
.foto{margin-bottom:12px}
.flab{display:block;font-size:.78rem;color:var(--muted)}
.fprev{margin:6px 0;font-size:.82rem;color:var(--muted)}
.fprev img{max-width:220px;max-height:160px;border-radius:8px;display:block}
.facts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.facts input[type=file]{width:auto;flex:1;min-width:0}
.box.wide-box{max-width:960px}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.gal figure{margin:0}
.gal img{width:100%;border-radius:8px;display:block}
.gal figcaption{font-size:.78rem;color:var(--muted);margin-top:4px}
.gimg{min-height:80px;background:var(--bg);border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:.8rem}
/* chat da IA */
#chat-log{max-height:60vh;overflow-y:auto;margin-bottom:12px}
.msg{padding:10px 12px;border-radius:10px;margin-bottom:10px;font-size:.88rem}
.msg.user{background:#eaf1ea;white-space:pre-wrap}
.msg.assistant{background:#faf9f6;border:1px solid var(--line)}
.msg b.who{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.msg h4{margin:10px 0 4px;color:var(--accent);font-size:.9rem}
.msg ul,.msg ol{margin:6px 0 6px 20px}
.msg p{margin:4px 0}
.msg code{background:#eee;padding:1px 5px;border-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chk{display:flex;gap:8px;align-items:center}
.chk input{width:auto;margin:0}
/* documentos gerados */
#docprint{display:none}
.docbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;overflow-x:auto;margin-top:12px}
.doc{color:#111;font-size:.82rem;min-width:640px;background:#fff}
.doc-h{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid #1f3d2f;padding-bottom:8px;margin-bottom:12px}
.doc-emp{font-size:1.2rem;font-weight:800;color:#1f3d2f;letter-spacing:.04em;text-transform:uppercase}
.doc-sub{font-size:.72rem;color:#555}
.doc-t{text-align:right}
.doc-t h1{font-size:1.05rem;margin:0}
.doc-t p{font-size:.72rem;color:#555;margin:2px 0 0}
.doc-s{font-size:.82rem;text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px;color:#1f3d2f}
.doc-p{margin:0 0 6px}
.doc table{width:100%;border-collapse:collapse}
.doc-kv th,.doc-kv td,.doc-t2 th,.doc-t2 td{border:1px solid #999;padding:5px 7px;text-align:left;vertical-align:top;white-space:normal;font-size:.78rem}
.doc-kv th,.doc-t2 th{background:#eee;color:#111;font-weight:700;text-transform:none;font-size:.74rem;width:auto}
.doc-kv th{width:14%}
.doc-t2 td{min-height:24px}
.doc-t2 td.c{text-align:center;width:44px}
.doc-ass{display:flex;gap:28px;margin-top:34px;flex-wrap:wrap}
.doc-ass>div{flex:1;min-width:150px;text-align:center;font-size:.74rem}
.doc-ass .linha{border-bottom:1px solid #111;height:30px;margin-bottom:4px}
.doc-rod{margin-top:18px;font-size:.68rem;color:#666;border-top:1px solid #ccc;padding-top:6px}
@media print{
  body.print-doc>*:not(#docprint){display:none!important}
  body.print-doc #docprint{display:block}
  body.print-doc .doc{min-width:0}
}
@page{size:A4;margin:12mm}
@media print{
  body{background:#fff}
  header,nav,.toolbar,.btn,#toast,.modal{display:none!important}
  main{padding:0;max-width:none}
  .print-head{display:block;margin-bottom:12px}
  .print-head h1{font-size:1.3rem;color:var(--accent)}
  .kpi,.card,.alert{break-inside:avoid}
  .kpi,.card,.bar i,.stack i,.chip,.pill,svg{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}


/* topo compacto, lançamento do dia */
.topo,.topo.bad,.topo.warn,.topo.ok{background:var(--card);border:1px solid var(--line);border-left-width:5px;padding:8px 12px}
.topo.bad{border-left-color:var(--bad)}.topo.warn{border-left-color:var(--warn)}.topo.ok{border-left-color:var(--ok)}
.topo-h{gap:8px 12px;flex-wrap:wrap}.tdata{font-weight:700;font-size:.86rem;text-transform:none}.tags{display:flex;gap:6px;flex-wrap:wrap;order:3;flex-basis:100%}
.tg{font-size:.72rem;padding:2px 9px}.topo-r{margin-left:auto;display:flex;gap:8px;align-items:center;order:2}
.topo-b{border-top:1px solid var(--line);padding-top:10px;margin-top:8px}
.lrow{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;display:grid;grid-template-columns:1fr 110px;gap:4px 12px;align-items:end;background:#fff}
.lrow.feito{border-color:#b5d9c1;background:#f6fbf8}.lrow .lt{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lrow label{margin:0}.lrow .lfile,.lrow .lobs{grid-column:1/-1}.lrow .lfile .fprev{margin:2px 0 4px}
.ev{font-size:.68rem;background:#fff4e0;color:#7a5200;border:1px solid #f1d29a;border-radius:99px;padding:1px 8px;font-weight:600}
.chkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 10px;margin:6px 0}
.tacoes{margin-bottom:8px}
@media (max-width:700px){.topo-r{width:100%}.topo-r .btn:not(.sm){flex:1}.lrow{grid-template-columns:1fr 90px}}

.radios{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:2px 0 6px}.radios .chk{margin:0;font-size:.82rem;color:var(--ink)}.radios .chk input{width:auto;margin:0 4px 0 0}
.lcomp{border-top:1px dashed var(--line);padding-top:6px}.ip{background:#fcfcfa}
/* celular */
.charts{grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}
.topo-b{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
button,.btn,nav a{touch-action:manipulation}
@media (max-width:700px){
  input,select,textarea{font-size:16px;padding:11px 10px}
  header{padding:10px 14px}
  header h1{font-size:1rem}
  .hdr-r{width:100%;justify-content:space-between}
  nav{padding:10px 14px;gap:6px;-webkit-overflow-scrolling:touch}
  nav a{padding:9px 14px;font-size:.88rem}
  main{padding:14px}
  .topo{margin:10px 14px 0;padding:10px 12px}
  .topo-h{font-size:.85rem}
  .rp{padding:8px 10px;font-size:.84rem;flex-wrap:wrap;gap:2px 8px;width:100%}
  .rp .btn{margin-left:auto}
  .pills{flex-direction:column}
  .rp .btn.sm,.vl2 .btn.sm,.card .btn.sm{padding:8px 12px;font-size:.82rem}
  .btn{padding:12px 16px}
  .toolbar{gap:8px}
  .toolbar label{flex:1 1 140px;min-width:0}
  .modal{padding:0;align-items:stretch}
  .box{border-radius:0;max-width:none;min-height:100%;padding:16px}
  .acts{position:sticky;bottom:0;background:var(--card);padding:10px 0;border-top:1px solid var(--line);margin-top:12px}
  .acts .btn{flex:1}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi b{font-size:1.5rem}
  .card{padding:12px}
  .chart{height:230px}
  .avrow{flex-wrap:wrap}.avl{width:100%}
  .gal{grid-template-columns:1fr 1fr}
  .fprev img{max-width:100%}
  .doc{min-width:560px}
  #toast{left:14px;right:14px;transform:none;text-align:center;border-radius:12px;bottom:16px}
  #chat-log{max-height:50vh}
  td.txt{min-width:160px}
}
@media (max-width:380px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="login" class="login hidden">
  <form id="login-f" autocomplete="on">
    <h1>Sistema QSMS Machine</h1>
    <p>Gestão de segurança do trabalho e terceiros. Acesso restrito.</p>
    <label>E-mail<input type="email" name="email" required autocomplete="username"></label>
    <label>Senha<input type="password" name="senha" required autocomplete="current-password"></label>
    <div class="erro" id="login-err"></div>
    <button class="btn" type="submit" style="width:100%">Entrar</button>
  </form>
</div>

<div id="shell" class="hidden">
  <header>
    <div><h1>Sistema QSMS Machine</h1><small>Segurança do trabalho • Meta: zero acidentes</small></div>
    <div class="hdr-r">
      <span id="quem"></span>
      <button class="btn" data-act="recarregar">Atualizar dados</button>
      <button class="btn" data-act="senha">Alterar senha</button>
      <button class="btn" data-act="sair">Sair</button>
    </div>
  </header>
  <nav id="nav"></nav>
  <div id="topo"></div>
  <main id="app"></main>
</div>

<div id="modal" class="modal hidden"></div>
<div id="toast"></div>
<button id="sec-fab" class="btn sec-fab hidden" data-act="sec-tog">🗒 Secretário<span class="bd hidden" id="sec-bd"></span></button>
<div id="sec-box" class="sec-box hidden"></div>
<div id="docprint"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
/* =====================================================================
   CONFIGURAÇÃO: cole aqui a URL do Aplicativo da Web (termina em /exec)
   ===================================================================== */
const API_URL = "https://script.google.com/macros/s/AKfycbyKaIOz0pUSlRwH_p7TygaKj3Xrn7BGY2Eu34G15uI9IPI6SGkAsARuKhJGSD_SyKT8gA/exec";

/* ============================ utilitários ============================ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isNaN(n) ? 0 : n; };
const store = {
  get(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ sessionStorage.removeItem(k); }catch(e){} }
};
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const hojeISO = () => iso(new Date());
const mesISO = () => hojeISO().slice(0,7);

async function api(acao, extra={}){
  if(!API_URL || API_URL.startsWith('COLE_AQUI')) throw new Error('Configure a constante API_URL no início do script (veja o LEIA-ME).');
  let j;
  try{
    // Sem cabeçalho Content-Type: evita o preflight CORS que o Apps Script não responde.
    const r = await fetch(API_URL, {method:'POST', body: JSON.stringify({acao, token:TOKEN, ...extra})});
    j = await r.json();
  }catch(e){ throw new Error('Não foi possível falar com o servidor. Verifique a conexão e a URL da API.'); }
  if(!j.ok){
    if(j.erro === 'SESSAO'){ sair(true); throw new Error('Sessão expirada. Entre novamente.'); }
    throw new Error(j.erro);
  }
  return j.data;
}

const Z = () => ({vt:0,dss:0,pit:0,acoes:0,insp:0,pt:0,apr:0,nv:0,ne:0,hht:0,qa:0,inc:0,acSem:0,acCpt:0,fat:0,dias:0,desvA:0,desvT:0});
const add = (a,b) => { Object.keys(b).forEach(k => a[k] = (a[k]||0) + b[k]); return a; };
const CH = ['vt','dss','pit','acoes','insp','pt','apr','nv','ne','hht'];
function statsObra(ob, mes){
  const s = Z();
  DB.Indicadores.forEach(i => {
    if(i.mes !== mes || i.obra !== ob) return;
    CH.forEach(k => s[k] += num(i[k]));
    s.qa += num(i.qaX); s.inc += num(i.incX); s.acSem += num(i.acSemX); s.acCpt += num(i.acCptX);
    s.desvA += num(i.desvAX); s.desvT += num(i.desvTX);
  });
  DB.Ocorrencias.forEach(o => {
    if(o.data.slice(0,7) !== mes || o.obra !== ob) return;
    const t = o.tipo;
    if(t==='Quase-acidente') s.qa++;
    else if(t==='Incidente') s.inc++;
    else if(t==='Acidente sem afastamento') s.acSem++;
    else if(t==='Acidente com afastamento'){ s.acCpt++; s.dias += num(o.diasPerdidos); }
    else if(t==='Fatal'){ s.fat++; s.dias += num(o.diasPerdidos); }
  });
  const lt = new Set(); (DB.InspCampo || []).forEach(x => { if(x.obra === ob && String(x.data).slice(0,7) === mes) lt.add(x.lote); }); s.insp += lt.size;
  (DB.Atividades || []).forEach(x => {
    if(x.obra !== ob || String(x.data).slice(0,7) !== mes) return;
    const k = ATIV_K[x.tipo]; if(k) s[k] += num(x.qtd);
  });
  DB.Desvios.forEach(d => {
    if(d.data.slice(0,7) !== mes || d.obra !== ob) return;
    s.desvA++; if(d.status === 'Concluído') s.desvT++;
  });
  return s;
}
const statsMes = (mes, obras) => obras.reduce((t,o) => add(t, statsObra(o,mes)), Z());

function terc(obras){
  const r = {aprov:0,ress:0,rep:0,aguard:0}, emp = new Set();
  DB.Terceiros.forEach(t => {
    if(obras.indexOf(t.obra) < 0 || t.situacaoObra === 'Desmobilizado') return;
    const q = t.qtd === '' ? 1 : num(t.qtd), s = t.status;
    if(s==='Aprovado') r.aprov += q;
    else if(s==='Aprovado com ressalva') r.ress += q;
    else if(s==='Reprovado') r.rep += q;
    else r.aguard += q;
    if(t.empresa) emp.add(t.empresa);
  });
  r.total = r.aprov + r.ress + r.rep + r.aguard; r.empresas = emp.size;
  return r;
}
function vincTerc(obras){

}

const FOTO_MAX = 1280;
const ARQ_MAX = 8 * 1024 * 1024;
const EMPRESA = 'Machine';
const dUrl = r => `data:${r.mime};base64,${r.b64}`;

function lerDataURL(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('Não foi possível ler o arquivo.'));
    fr.onload = () => res(fr.result);
    fr.readAsDataURL(file);
  });
}
async function comprimir(file){
  const src = await lerDataURL(file);
  return new Promise((res, rej) => {
    const im = new Image();
    im.onerror = () => rej(new Error('Arquivo de imagem inválido.'));
    im.onload = () => {
      const k = Math.min(1, FOTO_MAX / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.75));
    };
    im.src = src;
  });
}
async function obterArq(id){
  if(!FOTOS[id]) FOTOS[id] = await api('arquivo', {id});
  return FOTOS[id];
}
async function onFoto(inp){
  const k = inp.dataset.foto, f = inp.files[0]; if(!f) return;
  try{
    const d = await comprimir(f); PEND[k] = d;
    $('#fp-' + k).innerHTML = `<img src="${d}" alt="Pré-visualização">`;
  }catch(err){ toast(err.message, true); inp.value = ''; }
}
async function onArq(inp){
  const f = inp.files[0]; if(!f) return;
  if(f.size > ARQ_MAX){ toast('O arquivo passa de 8 MB. Reduza o tamanho e tente de novo.', true); inp.value = ''; return; }
  try{
    const d = await lerDataURL(f);
    PENDARQ.arquivoId = {nome:f.name, mime:f.type || 'application/octet-stream', b64:d.split(',')[1]};
    $('#fp-arq').textContent = 'Novo arquivo: ' + f.name + ' (será enviado ao salvar)';

async function baixarArq(id){
  const r = await obterArq(id);
  const bytes = Uint8Array.from(atob(r.b64), c => c.charCodeAt(0));
  const url = URL.createObjectURL(new Blob([bytes], {type:r.mime}));
  const a = document.createElement('a');
  a.href = url; a.download = r.nome;
  if(/pdf|image/.test(r.mime)) a.target = '_blank';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

const docSt = d => {
  if(d.status === 'Vigente' && d.validade){
    const n = diasEntre(hojeISO(), d.validade);
    if(n < 0) return 'Vencido';
    if(n <= 30) return 'A vencer';
  }
  return d.status;
};
const corDoc = s => s === 'Vigente' ? 'ok' : s === 'Vencido' ? 'bad' : (s === 'A vencer' || s === 'Pendente') ? 'warn' : s === 'Em elaboração' ? 'info' : '';
const asoSt = f => { if(!f.asoVenc) return 'Sem data'; const d = diasEntre(hojeISO(), f.asoVenc); return d < 0 ? 'Vencido' : d <= 30 ? 'A vencer' : 'Em dia'; };
const corAso = s => s === 'Vencido' ? 'bad' : s === 'A vencer' ? 'warn' : s === 'Em dia' ? 'ok' : '';
function epiVencidos(){

  (DB.EPIs || []).forEach(e => { const k = e.funcId + '|' + e.epi; if(!ult[k] || e.data > ult[k].data) ult[k] = e; });

}

const inl = s => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`(.+?)`/g, '<code>$1</code>');
function md(t){
  let h = '', lst = '';
  const fecha = () => { if(lst){ h += `</${lst}>`; lst = ''; } };
  esc(t).split('\n').forEach(l => {
    let m;
    if((m = l.match(/^#{1,4}\s+(.*)/))){ fecha(); h += `<h4>${inl(m[1])}</h4>`; }
    else if((m = l.match(/^\s*[-*•]\s+(.*)/))){ if(lst !== 'ul'){ fecha(); h += '<ul>'; lst = 'ul'; } h += `<li>${inl(m[1])}</li>`; }
    else if((m = l.match(/^\s*\d+[.)]\s+(.*)/))){ if(lst !== 'ol'){ fecha(); h += '<ol>'; lst = 'ol'; } h += `<li>${inl(m[1])}</li>`; }
    else if(!l.trim()) fecha();
    else { fecha(); h += `<p>${inl(l)}</p>`; }
  });
  fecha(); return h;
}

  const ta = $('#ia-q'); if(!ta) return;

  CHAT.push({role:'user', content:q}); ta.value = '';

      linha.tarefa = m.tarefa; if(!linha.qtd) linha.qtd = '1';
    }
    if(aba === 'LiberacoesExc'){
      const e = linha.empresaId ? empDe(linha.empresaId) : null;
      if(e){ if(!linha.empresa) linha.empresa = e.nome; if(!linha.obra) linha.obra = e.obra; }

      if(!linha.obra) throw new Error('Escolha a obra.');

const docAvalOk = d => d.status === 'Aprovado' || d.status === 'Aprovado com ressalva' || d.status === 'Reprovado';
function docsResumo(obras, mes){
  const tr = {}; DB.Terceiros.forEach(t => { if(obras.indexOf(t.obra) >= 0 && t.situacaoObra !== 'Desmobilizado') tr[t.id] = t; });
  const em = {}; DB.Empresas.forEach(e => { if(obras.indexOf(e.obra) >= 0 && e.status !== 'Desligada') em[e.id] = e; });
  const r = {total:0, aval:0, aprov:0, ress:0, rep:0, venc:0, pend:0, noMes:0, trabAval:0, trabTot:Object.keys(tr).length, empAval:0, empTot:Object.keys(em).length, porObra:{}};
  obras.forEach(o => r.porObra[o] = {total:0, aval:0, aprov:0, ress:0, rep:0, pend:0});
  const trComDoc = new Set(), emComDoc = new Set();
  const cont = (d, ob, tipo, id) => {
    r.total++; const po = r.porObra[ob] || (r.porObra[ob] = {total:0, aval:0, aprov:0, ress:0, rep:0, pend:0}); po.total++;
    if(docAvalOk(d)){
      r.aval++; po.aval++;
      if(d.status === 'Aprovado'){ r.aprov++; po.aprov++; } else if(d.status === 'Aprovado com ressalva'){ r.ress++; po.ress++; } else { r.rep++; po.rep++; }
      if(String(d.dataAvaliacao).slice(0,7) === mes) r.noMes++;
      (tipo === 't' ? trComDoc : emComDoc).add(id);
    } else if(d.status !== 'Não se aplica'){ r.pend++; po.pend++; }
    if(docEstado(d) === 'Vencido') r.venc++;
  };
  DB.TercDocs.forEach(d => { const t = tr[d.trabId]; if(t) cont(d, t.obra, 't', t.id); });
  DB.DocsEmpresa.forEach(d => { const e = em[d.empresaId]; if(e) cont(d, e.obra, 'e', e.id); });
  r.trabAval = trComDoc.size; r.empAval = emComDoc.size;
  return r;
}

}

function autoAval(u, mes){
  const eu = {email:u.email, cargo:u.cargo, obras:u.obras}, rot = rotinaMes(eu, mes), at = rotinaAtrasos(eu).length;
  const f = u.funcId ? funcDe(u.funcId) : null, nm = f ? f.nome.trim().toLowerCase() : '';
  const dv = nm ? DB.Desvios.filter(d => (d.who || '').trim().toLowerCase() === nm) : [];
  const resDv = dv.length ? dv.filter(d => d.status === 'Concluído').length / dv.length * 100 : null;
  const base = rot === null ? null : rot * 0.6 + Math.max(0, 100 - at * 5) * 0.4;
  return {u, rot, at, resDv, dvAt:dv.filter(atrasado).length, nota:base};
}

const DOC_ST = ['Aprovado','Aprovado com ressalva','Reprovado','Aguardando','Não se aplica','Pendente'];
const DVS = [['ASO','aso'],['Treinamento NR-18','nr18'],['Treinamento NR-35','nr35'],['Treinamento NR-12','nr12'],['Treinamento NR-06','nr06']];
const DOCS_TRAB = ['CNH / Documento de identificação','Ficha de registro','CTPS / eSocial / Contrato','ASO','Ordem de serviço (OS)','Ficha de EPI','Treinamento NR-06','Treinamento NR-12','Treinamento NR-18','Treinamento NR-35'];
const DOCS_EMP = ['CNPJ','Alvará de Funcionamento','AVCB','Licenciamento Ambiental','IBAMA / CTF','PGR','PCMSO','Certidões'];
const INTEGR = ['Realizado','Agendar','Pendente'];
const OKS = ['Aprovado','Aprovado com ressalva','Não se aplica','A vencer'];
const corDS = s => s === 'Aprovado' ? 'ok' : (s === 'Aprovado com ressalva' || s === 'A vencer') ? 'warn' : (s === 'Reprovado' || s === 'Vencido') ? 'bad' : s === 'Aguardando' ? 'info' : '';
let TSUB = 'resumo', TF = {q:'', obra:'', emp:'', st:'', sit:'', vinc:''}, TFICHA = null;

const empDe = id => DB.Empresas.find(e => e.id === id);
const empNome = t => { const e = empDe(t.empresaId); return e ? e.nome : (t.empresa || '—'); };
const docEstado = d => {
  if(!d) return 'Pendente';
  if((d.status === 'Aprovado' || d.status === 'Aprovado com ressalva') && d.validade){
    const n = diasEntre(hojeISO(), d.validade);
    if(n < 0) return 'Vencido';
    if(n <= 30) return 'A vencer';
  }
  return d.status || 'Pendente';
};
const docMap = (aba, chave, id) => { const m = {}; DB[aba].forEach(d => { if(d[chave] === id) m[d.doc] = d; }); return m; };
const listaDocsTrab = t => { const m = docMap('TercDocs','trabId',t.id); return DOCS_TRAB.concat(Object.keys(m).filter(k => DOCS_TRAB.indexOf(k) < 0)); };
function tercPend(t){
  const m = docMap('TercDocs','trabId',t.id), p = [];
  listaDocsTrab(t).forEach(k => { const e = docEstado(m[k]); if(OKS.indexOf(e) < 0) p.push({doc:k, e}); });
  if(t.integracao !== 'Realizado') p.push({doc:'Integração Machine', e:t.integracao || 'Pendente'});
  return p;
}
const sugest = t => { const p = tercPend(t); return p.length ? ['Pendências (' + p.length + ')', 'warn', p] : ['Documentação completa', 'ok', p]; };
function empPend(e){
  const m = docMap('DocsEmpresa','empresaId',e.id);
  return Object.keys(m).filter(k => OKS.indexOf(docEstado(m[k])) < 0).map(k => ({doc:k, e:docEstado(m[k])}));
}
const refTrab = t => t.dataAvaliacao || t.dataLiberacao || t.dataMobilizacao || '';
const ehAprov = s => s === 'Aprovado' || s === 'Aprovado com ressalva';
function tercMes(mes, obras){
  const l = DB.Terceiros.filter(t => obras.indexOf(t.obra) >= 0 && String(refTrab(t)).slice(0,7) === mes);
  const r = {n:l.length, aprov:0, ress:0, rep:0, aguard:0, semData:0, dias:[],
    emp: DB.Empresas.filter(e => obras.indexOf(e.obra) >= 0 && e.tipo !== 'Própria' && String(e.mobilizacao).slice(0,7) === mes).length};
  l.forEach(t => {
    if(t.status === 'Aprovado') r.aprov++; else if(t.status === 'Aprovado com ressalva') r.ress++;
    else if(t.status === 'Reprovado') r.rep++; else r.aguard++;
    if(!t.dataAvaliacao && !t.dataLiberacao) r.semData++;
    if(t.dataMobilizacao && t.dataLiberacao && ehAprov(t.status)){ const d = diasEntre(t.dataMobilizacao, t.dataLiberacao); if(d >= 0) r.dias.push(d); }
  });
  r.aval = r.aprov + r.ress + r.rep;
  r.conf = pct(r.aprov + r.ress, r.aval);
  r.tmed = r.dias.length ? r.dias.reduce((a,b) => a + b, 0) / r.dias.length : null;
  return r;
}
function tercVenc(obras){
  const ids = new Set(DB.Terceiros.filter(t => obras.indexOf(t.obra) >= 0 && t.situacaoObra !== 'Desmobilizado').map(t => t.id));
  const emps = DB.Empresas.filter(e => obras.indexOf(e.obra) >= 0 && e.status !== 'Desligada');
  const eids = new Set(emps.map(e => e.id));
  let v = 0, a = 0;
  DB.TercDocs.filter(d => ids.has(d.trabId)).concat(DB.DocsEmpresa.filter(d => eids.has(d.empresaId))).forEach(d => { const e = docEstado(d); if(e === 'Vencido') v++; else if(e === 'A vencer') a++; });
  return {v, a, empPend: emps.filter(e => empPend(e).length).length};
}

const BIRD = [1, 10, 30, 600];
function nivPir(s){
  return [
    {l:'Lesão grave ou fatal', sub:'Fatalidades e acidentes com afastamento', n:s.fat + s.acCpt, c:'#7a1a10'},
    {l:'Lesão leve', sub:'Acidentes sem afastamento', n:s.acSem, c:C.lar},

function svgPiramide(niv){
  const H = 340, cx = 150, hw = 140, h = H / niv.length;
  let s = `<svg viewBox="0 0 700 350" class="pir" role="img" aria-label="Pirâmide de Bird">`;
  niv.forEach((v, i) => {
    const y0 = i * h + 2, y1 = (i + 1) * h - 2, w0 = hw * (y0 / H), w1 = hw * (y1 / H), ym = (y0 + y1) / 2;
    s += `<polygon points="${cx - w0},${y0} ${cx + w0},${y0} ${cx + w1},${y1} ${cx - w1},${y1}" fill="${v.c}"/>`;
    s += `<text x="${cx}" y="${ym + 7}" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">${v.n}</text>`;
    s += `<text x="${cx + hw + 18}" y="${ym - 4}" fill="currentColor" font-size="15" font-weight="700">${esc(v.l)}</text>`;
    s += `<text x="${cx + hw + 18}" y="${ym + 14}" fill="currentColor" font-size="12" opacity=".7">${esc(v.sub || '')} • referência ${BIRD[i]}</text>`;
  });
  return s + '</svg>';
}

function obrasUsuario(u){
  const t = String(u.obras || '').trim(), at = obrasNomes();
  if(!t || /^todas$/i.test(t)) return at;
  return t.split(/[;,]/).map(x => x.trim()).filter(x => at.indexOf(x) >= 0);

function rotinaItens(u, dia, regs){
  const out = [], seg = segundaDe(dia), dom = addDias(seg, 6), em = String(u.email || '').toLowerCase();
  DB.RotinaModelos.filter(m => m.ativo !== 'Não' && m.cargo === u.cargo).forEach(m => {
    const diaria = m.frequencia !== 'Semanal';
    if(diaria && !ehUtil(dia)) return;
    const de = diaria ? dia : seg, ate = diaria ? dia : dom, meta = num(m.meta) || 1;
    (m.porObra === 'Sim' ? obrasUsuario(u) : ['']).forEach(o => {
      const AT = RTIPO[m.tipo], INS = m.tipo === 'Inspeção';
      const feito = INS
        ? new Set((DB.InspCampo || []).filter(x => x.inspetorEmail && x.inspetorEmail.toLowerCase() === em && (!o || x.obra === o) && x.data >= de && x.data <= ate).map(x => x.lote)).size
        : AT
        ? (DB.Atividades || []).filter(x => x.email && x.email.toLowerCase() === em && x.tipo === AT && (!o || x.obra === o) && x.data >= de && x.data <= ate).reduce((t, x) => t + (num(x.qtd) || 0), 0)
        : regs.filter(x => x.email && x.email.toLowerCase() === em && x.modeloId === m.id && (!o || x.obra === o) && x.data >= de && x.data <= ate).reduce((t, x) => t + (num(x.qtd) || 1), 0);
      out.push({m, obra:o, meta, feito, ok:feito >= meta, diaria, lanc:!!AT, insp:INS});
    });
  });
  return out;
}
const rotinaPct = its => { const m = its.reduce((t, x) => t + x.meta, 0); return m ? its.reduce((t, x) => t + Math.min(x.feito, x.meta), 0) / m * 100 : null; };
function rotinaMes(u, mes){
  const hoje = hojeISO(), dias = []; let d = mes + '-01';
  while(d.slice(0,7) === mes && d <= hoje){ if(ehUtil(d)) dias.push(d); d = addDias(d, 1); }
  let ex = 0, fe = 0; const semanas = {};
  dias.forEach(dia => {
    rotinaItens(u, dia, DB.RotinaRegs).filter(x => x.diaria).forEach(x => { ex += x.meta; fe += Math.min(x.feito, x.meta); });
    const sg = segundaDe(dia); semanas[sg] = dia;
  });
  Object.values(semanas).forEach(dia => rotinaItens(u, dia, DB.RotinaRegs).filter(x => !x.diaria).forEach(x => { ex += x.meta; fe += Math.min(x.feito, x.meta); }));
  return ex ? fe / ex * 100 : null;
}

    <h2>Modelos de rotina por cargo</h2>${vCrud('RotinaModelos')}`;

/* ---------- vencimentos agregados ---------- */
function vencItens(){
  const hoje = hojeISO(), it = [];
  const add = (v, rot, nome, data, view) => {
    if(!data) return;
    const d = diasEntre(hoje, data);
    if(d <= 30) it.push({d, v, view, t:(d < 0 ? 'Vencido há ' + (-d) + ' dia(s)' : d === 0 ? 'Vence hoje' : 'Vence em ' + d + ' dia(s)') + ' — ' + rot + ': ' + nome});
  };
  DB.Documentos.forEach(x => { if(x.status === 'Vigente') add(0, 'Documento SST', x.nome, x.validade, EU.perfil === 'admin' ? 'ger' : 'bib'); });
  DB.Treinamentos.forEach(x => add(0, 'Treinamento ' + x.tipo, x.colaborador, x.vencimento, 'trein'));
  DB.Funcionarios.forEach(x => { if(x.status !== 'Desligado') add(0, 'ASO', x.nome, x.asoVenc, 'func'); });
  const ult = {}; DB.EPIs.forEach(e => { const k = e.funcId + '|' + e.epi; if(!ult[k] || e.data > ult[k].data) ult[k] = e; });
  Object.values(ult).forEach(e => { const f = funcDe(e.funcId); if(f && f.status !== 'Desligado') add(0, 'EPI ' + e.epi, f.nome, e.validade, 'func'); });
  const trab = {}; DB.Terceiros.forEach(t => trab[t.id] = t);
  DB.TercDocs.forEach(x => { const t = trab[x.trabId]; if(t && t.situacaoObra !== 'Desmobilizado' && /^Aprovado/.test(x.status)) add(0, x.doc + ' (terceiro)', t.nome + ' / ' + t.obra, x.validade, 'terc'); });
  excVigentes().forEach(x => add(0, 'Liberação por exceção a regularizar', x.empresa + ' / ' + x.obra, x.prazo, 'terc'));
  DB.DocsEmpresa.forEach(x => { const e = empDe(x.empresaId); if(e && e.status !== 'Desligada' && /^Aprovado/.test(x.status)) add(0, x.doc + ' (empresa)', e.nome + ' / ' + e.obra, x.validade, 'terc'); });
  return it.sort((a, b) => a.d - b.d);
}

async function salvarLanc(f){
  const btn = f.querySelector('button[type=submit]'), fd = new FormData(f);
  const obra = fd.get('obra'), data = fd.get('data'), ent = fd.get('entrada'), sai = fd.get('saida');
  try{
    if(!obra || !data) throw new Error('Escolha a obra e a data.');
    if(data > hojeISO()) throw new Error('Não é possível lançar em data futura.');
    const ex = lancExist(obra, data), ops = [];
    if(ent || sai){
      if(!ent || !sai) throw new Error('Informe o horário de entrada e o de saída.');
      if(sai <= ent) throw new Error('A saída precisa ser depois da entrada.');
      ops.push({linha:{id:ex['Jornada'] && ex['Jornada'].id, data, obra, tipo:'Jornada', entrada:ent, saida:sai}});
    } else if(ex['Jornada']) ops.push({del:ex['Jornada']});
    ATIVS.forEach(a => {
      const q = Number(fd.get('q_' + a.k) || 0), e = ex[a.t];
      if(q > 0){
        const modo = a.ev ? (fd.get('c_' + a.k) === 'Verbal' ? 'Verbal' : 'Anexo') : '', obsx = (fd.get('o_' + a.k) || '').trim();
        if(modo === 'Anexo' && !LP[a.t] && !(e && e.arquivoId)) throw new Error('Anexe a comprovação de ' + a.t + ' ou escolha “Verbal” e descreva.');
        if(modo === 'Verbal' && obsx.length < 8) throw new Error('Descreva o registro verbal de ' + a.t + ' (tema e participantes) no campo de observação.');
        ops.push({a, novo:modo === 'Anexo' ? LP[a.t] : null, linha:{id:e && e.id, data, obra, tipo:a.t, qtd:String(q), obs:obsx, comprovacao:modo, arquivoId:modo === 'Anexo' && e ? e.arquivoId : '', arquivoNome:modo === 'Anexo' && e ? e.arquivoNome : ''}});
      } else if(e) ops.push({del:e});
    });
    if(!ops.length) throw new Error('Preencha pelo menos uma atividade ou o horário do dia.');
    const dels = ops.filter(o => o.del);
    if(dels.length && !confirm('Você zerou ' + dels.length + ' item(ns) já lançado(s). Eles serão removidos. Continuar?')) return;
    btn.disabled = true;
    for(const o of ops){
      if(o.del){ btn.textContent = 'Removendo…'; await api('excluir', {aba:'Atividades', id:o.del.id}); continue; }
      if(o.novo){ btn.textContent = 'Enviando evidência…'; const r = await api('upload', {tipo:'ativ', nome:o.novo.nome, mime:o.novo.mime, b64:o.novo.b64}); o.linha.arquivoId = r.id; o.linha.arquivoNome = r.nome; }
      btn.textContent = 'Salvando…'; await api('salvar', {aba:'Atividades', linha:o.linha});
    }
    await recarregar(); fechar(); render(); toast('Dia lançado: ' + brData(data) + ' — ' + obra);
  }catch(err){ toast(err.message, true); btn.disabled = false; btn.textContent = 'Salvar lançamento'; }
}

const RISCOS = ['Baixo','Médio','Alto','Crítico'], RISCO_DIAS = {'Baixo':15,'Médio':7,'Alto':3,'Crítico':1};
const corRisco = r => r === 'Crítico' ? 'bad' : r === 'Alto' ? 'bad' : r === 'Médio' ? 'warn' : 'info';

function inspLotes(){
  const m = {};
  (DB.InspCampo || []).forEach(x => { (m[x.lote] = m[x.lote] || []).push(x); });
  return Object.values(m).sort((a, b) => b[0].data.localeCompare(a[0].data) || b[0].criadoEm.localeCompare(a[0].criadoEm));
}
function vInsp(){
  const hoje = hojeISO(), mes = hoje.slice(0, 7), obraOk = x => !IF.obra || x.obra === IF.obra;
  const todos = (DB.InspCampo || []).filter(obraOk), ab = todos.filter(x => x.status !== 'Concluída');
  const venc = ab.filter(inspVencido), conc = todos.filter(x => x.status === 'Concluída' && String(x.dataSolucao).slice(0, 7) === mes);
  const lotes = inspLotes().filter(l => obraOk(l[0])).filter(l => IF.st === 'todas' || (IF.st === 'abertas' ? l.some(x => x.status !== 'Concluída') : l.every(x => x.status === 'Concluída')));
  const nMes = new Set(todos.filter(x => String(x.data).slice(0, 7) === mes).map(x => x.lote)).size;
  const pend = ab.slice().sort((a, b) => a.prazo.localeCompare(b.prazo));
  const linhaPend = x => { const d = diasEntre(x.prazo, hoje);
    return `<tr><td>${d > 0 ? chip(d + ' dia(s) de atraso', 'bad') : d === 0 ? chip('Vence hoje', 'warn') : chip('Faltam ' + (-d) + ' dia(s)', 'ok')}</td><td>${esc(x.obra)}</td><td class="txt"><b>${esc(x.achado)}</b><br><span class="cont">${esc(x.local || '')} ${x.nr ? '• ' + esc(x.nr) : ''}</span></td><td>${chip(x.risco, corRisco(x.risco))}</td><td>${esc(x.responsavel || '—')}</td><td>${esc(brData(x.prazo))}</td>
      <td><button class="btn sm" data-act="insp-res" data-id="${esc(x.id)}">Resolver</button> <button class="btn ghost sm" data-act="insp-det" data-l="${esc(x.lote)}">Abrir</button></td></tr>`; };
  return `<div class="nota">Registre a inspeção de campo direto da obra: <b>tire a foto, descreva o achado, o porquê, o responsável e o prazo de solução</b>. O que não for resolvido <b>fica acumulado</b> aqui e no topo do sistema até ser concluído com a foto e a data da solução. Cada inspeção gera um relatório em PDF e pode ser enviada por e-mail ao gestor da obra.</div>
    <div class="toolbar"><button class="btn" data-act="insp-nova">+ Nova inspeção</button>
      <label>Obra<select data-ig="obra"><option value="">Todas</option>${obrasNomes().map(o => `<option ${IF.obra === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></label>
      <label>Inspeções<select data-ig="st"><option value="abertas" ${IF.st === 'abertas' ? 'selected' : ''}>Com itens em aberto</option><option value="concluidas" ${IF.st === 'concluidas' ? 'selected' : ''}>Concluídas</option><option value="todas" ${IF.st === 'todas' ? 'selected' : ''}>Todas</option></select></label></div>
    <div class="grid" style="margin-bottom:14px">${kpi('Itens em aberto', ab.length, 'acumulados de todas as inspeções', ab.length ? 'warn' : 'ok')}${kpi('Com prazo vencido', venc.length, venc.length ? 'cobrar solução' : 'nenhum atrasado', venc.length ? 'bad' : 'ok')}${kpi('Concluídos no mês', conc.length, nomeMes(mes))}${kpi('Inspeções no mês', nMes, nomeMes(mes))}</div>
    <h2>Pendências acumuladas</h2><div class="card">${pend.length ? `<table class="crud"><thead><tr><th>Prazo</th><th>Obra</th><th>O que falta resolver</th><th>Gravidade</th><th>Responsável</th><th>Vence em</th><th></th></tr></thead><tbody>${pend.map(linhaPend).join('')}</tbody></table>` : '<p class="vazio">Nenhum item em aberto. 👍</p>'}</div>
    <h2>Inspeções realizadas</h2><div class="card">${lotes.length ? `<table class="crud"><thead><tr><th>Data</th><th>Obra</th><th>Local</th><th>Inspetor</th><th>Itens</th><th>Em aberto</th><th></th></tr></thead><tbody>${lotes.map(l => { const a = l.filter(x => x.status !== 'Concluída').length;
      return `<tr><td>${esc(brData(l[0].data))}</td><td>${esc(l[0].obra)}</td><td>${esc(l[0].local || '—')}</td><td>${esc(l[0].inspetor)}</td><td>${l.length}</td><td>${a ? chip(a, l.some(inspVencido) ? 'bad' : 'warn') : chip('Concluída', 'ok')}</td>
      <td><button class="btn ghost sm" data-act="insp-det" data-l="${esc(l[0].lote)}">Abrir</button> <button class="btn ghost sm" data-act="insp-rel" data-l="${esc(l[0].lote)}">Relatório</button> <button class="btn ghost sm" data-act="insp-env" data-l="${esc(l[0].lote)}">Enviar ao gestor</button></td></tr>`; }).join('')}</tbody></table>` : '<p class="vazio">Nenhuma inspeção neste filtro.</p>'}</div>`;
}

  $('#modal').classList.remove('hidden'); inspAdd();

function inspAdd(){

}
function inspNum(){ document.querySelectorAll('#insp-itens .ip').forEach((el, k) => { el.querySelector('.ipn').textContent = k + 1; }); }
async function onInspFoto(inp){
  const i = inp.dataset.ip, f = inp.files[0]; if(!f) return;
  try{ const d = await comprimir(f); IP[i] = d; $('#ipf-' + i).innerHTML = `<img src="${d}" alt="Foto do item">`; }
  catch(err){ toast(err.message, true); inp.value = ''; }
}
async function salvarInspecao(f){
  const btn = f.querySelector('button[type=submit]'), fd = new FormData(f);
  const obra = fd.get('obra'), data = fd.get('data'), local = fd.get('local') || '';
  const blocos = [...document.querySelectorAll('#insp-itens .ip')];
  try{
    if(!obra || !data) throw new Error('Escolha a obra e a data.');
    if(data > hojeISO()) throw new Error('Não é possível lançar em data futura.');
    const itens = blocos.map((b, k) => {
      const g = n => (b.querySelector('[name="' + n + '"]') || {}).value || '';
      if(g('achado').trim().length < 3) throw new Error('Descreva o que foi encontrado no item ' + (k + 1) + '.');
      if(!g('prazo')) throw new Error('Informe o prazo de solução do item ' + (k + 1) + '.');
      if(g('prazo') < data) throw new Error('O prazo do item ' + (k + 1) + ' não pode ser anterior à data da inspeção.');
      return {i:b.dataset.i, achado:g('achado').trim(), porque:g('porque'), risco:g('risco'), nr:g('nr'), responsavel:g('responsavel'), prazo:g('prazo')};
    });
    if(!itens.length) throw new Error('Adicione pelo menos um item.');
    btn.disabled = true;
    const lote = 'INS-' + data.replace(/-/g, '') + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
    let feitos = 0;
    try{
      for(const it of itens){
        let fotoAntes = '';
        if(IP[it.i]){ btn.textContent = 'Enviando foto ' + (feitos + 1) + '/' + itens.length + '…'; fotoAntes = (await api('upload', {tipo:'insp', nome:'inspecao.jpg', mime:'image/jpeg', b64:IP[it.i].split(',')[1]})).id; }
        btn.textContent = 'Salvando ' + (feitos + 1) + '/' + itens.length + '…';
        await api('salvar', {aba:'InspCampo', linha:{lote, data, obra, local, achado:it.achado, porque:it.porque, nr:it.nr, risco:it.risco, responsavel:it.responsavel, prazo:it.prazo, status:'Aberta', fotoAntes}});
        feitos++;
      }
    }catch(err){ await recarregar(); render(); throw new Error('Salvou ' + feitos + ' de ' + itens.length + ' item(ns). ' + err.message + ' Abra a inspeção para completar.'); }
    await recarregar(); fechar(); render(); toast('Inspeção salva: ' + itens.length + ' item(ns)'); inspDetalhe(lote);
  }catch(err){ toast(err.message, true); btn.disabled = false; btn.textContent = 'Salvar inspeção'; }
}
function inspDetalhe(lote){
  const l = (DB.InspCampo || []).filter(x => x.lote === lote); if(!l.length) return;
  const h = l[0];
  $('#modal').innerHTML = `<div class="box wide-box"><h3>Inspeção de ${esc(brData(h.data))} — ${esc(h.obra)}</h3>

/* ---------- pendências acumuladas da rotina ---------- */
const ROT_JANELA = 14;
function rotinaAtrasos(u){
  const hoje = hojeISO(), out = [], semAtual = segundaDe(hoje), semanas = {};
  for(let k = 1; k <= ROT_JANELA; k++){
    const dd = addDias(hoje, -k); if(!ehUtil(dd)) continue;
    rotinaItens(u, dd, DB.RotinaRegs).filter(x => x.diaria && !x.ok).forEach(x => out.push(Object.assign({dia:dd}, x)));
    const sg = segundaDe(dd); if(sg < semAtual) semanas[sg] = 1;
  }
  Object.keys(semanas).forEach(sg => rotinaItens(u, sg, DB.RotinaRegs).filter(x => !x.diaria && !x.ok).forEach(x => out.push(Object.assign({dia:sg, semana:true}, x))));
  return out.sort((a, b) => b.dia.localeCompare(a.dia));
}

function temaDia(iso, tipo){

const VALID_PAD = {
  'ASO':[12,'ASO periódico: em regra 12 meses (pode ser 24 meses em atividades de baixo risco). Confirme no PCMSO.'],
  'NR-35':[24,'NR-35: reciclagem a cada 2 anos.'], 'NR-10':[24,'NR-10: reciclagem a cada 2 anos.'],
  'NR-33':[12,'NR-33: reciclagem anual.'], 'NR-18':[12,'NR-18: sugestão de 12 meses. Confirme no programa de capacitação da obra.'],
  'Integração':[12,'Integração: sugestão de 12 meses. Confirme o procedimento da obra.']
};
function chaveValid(t){ t = String(t || ''); if(/\baso\b/i.test(t)) return 'ASO'; const m = t.match(/NR-?\s?0?(\d+)/i); if(m) return 'NR-' + m[1]; if(/integra/i.test(t)) return 'Integração'; return ''; }
function addMeses(iso, n){
  const [y,m,d] = iso.split('-').map(Number), dt = new Date(Date.UTC(y, m - 1 + n, 1));
  const ult = new Date(Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth() + 1, 0)).getUTCDate();
  dt.setUTCDate(Math.min(d, ult)); return dt.toISOString().slice(0,10);
}
function sugValid(tipo, data){ const p = VALID_PAD[chaveValid(tipo)]; return (p && /^\d{4}-\d{2}-\d{2}$/.test(data || '')) ? {data:addMeses(data, p[0]), meses:p[0], nota:p[1]} : null; }
function sugChange(t){
  const aba = t.form.dataset.aba, m = MOD[aba]; if(!m) return false;
  let feito = false;
  m.campos.filter(c => c.sug && (c.sug.de === t.name || c.sug.tipo === t.name)).forEach(c => {
    const f = t.form, de = f.elements[c.sug.de], tp = c.sug.tipo ? f.elements[c.sug.tipo] : null, alvo = f.elements[c.k], dica = document.getElementById('sug-' + c.k);
    if(!de || !alvo) return; feito = true;
    const r = sugValid(c.sug.fixo || (tp && tp.value), de.value);
    if(r){
      if(!alvo.value || alvo.dataset.auto){ alvo.value = r.data; alvo.dataset.auto = '1'; alvo.classList.add('iasug'); }
      if(dica) dica.innerHTML = 'Sugestão: ' + r.meses + ' meses após a realização. ' + esc(r.nota) + ' <button type="button" class="btn ghost sm" data-act="ia-venc" data-k="' + c.k + '">✨ Perguntar à IA</button>';
    } else if(dica) dica.innerHTML = 'Sem prazo fixo na tabela do sistema. <button type="button" class="btn ghost sm" data-act="ia-venc" data-k="' + c.k + '">✨ Perguntar à IA</button>';
  });
  return feito;
}

async function salvarDocsTrab(id, dvs){

function iaAplicar(root, vals, forcar){

  if(!SR){ toast('Este navegador não tem ditado por voz. Use o microfone do teclado do celular.', true); return; }

  if(!alvo) return;

  const t0 = btn.textContent; btn.textContent = '⏹ Parar'; btn.classList.add('rec');
  rec.onresult = ev => { for(let k = ev.resultIndex; k < ev.results.length; k++) if(ev.results[k].isFinal) alvo.value += (alvo.value && !/\s$/.test(alvo.value) ? ' ' : '') + ev.results[k][0].transcript.trim(); };
  rec.onend = () => { btn.textContent = t0; btn.classList.remove('rec'); REC_ATIVO = null; };
  rec.onerror = () => { btn.textContent = t0; btn.classList.remove('rec'); REC_ATIVO = null; };
  REC_ATIVO = {rec}; rec.start();
}

async function reuGravar(btn){
  if(REU.mr && REU.mr.state === 'recording'){ REU.mr.stop(); return; }
  if(!navigator.mediaDevices || !window.MediaRecorder){ toast('Este navegador não grava áudio. Envie um arquivo de áudio ou cole o texto.', true); return; }
  try{
    const st = await navigator.mediaDevices.getUserMedia({audio:true});
    const mt = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].find(x => MediaRecorder.isTypeSupported(x)) || '';
    const mr = new MediaRecorder(st, Object.assign({audioBitsPerSecond:24000}, mt ? {mimeType:mt} : {}));
    REU.chunks = []; REU.mr = mr; REU.t0 = Date.now();
    mr.ondataavailable = e => { if(e.data.size) REU.chunks.push(e.data); };
    mr.onstop = () => {
      st.getTracks().forEach(t => t.stop()); clearInterval(REU.tick);
      REU.mime = (mr.mimeType || mt || 'audio/webm').split(';')[0]; REU.blob = new Blob(REU.chunks, {type:REU.mime});
      REU.audioId = ''; REU.audioNome = 'reuniao-' + hojeISO() + '.' + (REU.mime.split('/')[1] || 'webm').replace('mpeg', 'mp3');
      btn.textContent = '🎙 Gravar áudio'; btn.classList.remove('rec');
      const mb = (REU.blob.size / 1048576).toFixed(1);
      $('#reu-aud').innerHTML = `<p class="cont">🎧 Gravação pronta (${mb} MB). Será enviada ao salvar. <button type="button" class="btn ghost sm" data-act="reu-aud-rem">Descartar</button></p>`;
      $('#reu-st').textContent = REU.blob.size > 20 * 1048576 ? 'Atenção: passa de 20 MB e não será aceita.' : '';
    };
    mr.start(1000); btn.classList.add('rec');
    REU.tick = setInterval(() => { const s = Math.floor((Date.now() - REU.t0) / 1000); btn.textContent = '⏹ Parar (' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') + ')'; }, 500);
  }catch(e){ toast('Não foi possível usar o microfone. Libere a permissão no navegador.', true); }
}

    else if(a==='u-novo') abrirForm('Usuarios');
    else if(a==='u-edit') abrirForm('Usuarios', id);
    else if(a==='u-del') await excluirUsuario(id);
    else if(a==='fotos') abrirFotos(aba, id);
    else if(a==='foto-rem'){
      const k = el.dataset.k; delete PEND[k];
      const h = document.querySelector('#modal input[name="' + k + '"]'); if(h) h.value = '';
      $('#fp-' + k).textContent = 'Sem foto'; $('#ff-' + k).value = '';
    }
    else if(a==='arq-rem'){
      delete PENDARQ.arquivoId;
      document.querySelectorAll('#modal input[name="arquivoId"],#modal input[name="arquivoNome"]').forEach(i => i.value = '');
      $('#fp-arq').textContent = 'Nenhum arquivo anexado'; $('#fa-arq').value = '';
    }
    else if(a==='baixar') await baixarArq(id);
    else if(a==='ficha'){ FICHA = id; render(); window.scrollTo(0,0); }
    else if(a==='ficha-voltar'){ FICHA = ''; render(); window.scrollTo(0,0); }
    else if(a==='ficha-epi') imprimirDoc(TPL.epi.render({func:FICHA}));
    else if(a==='sec-tog') await secTog();
    else if(a==='sec-send') await secEnviar();
    else if(a==='sec-chip'){ $('#sec-q').value = el.dataset.q; await secEnviar(); }
    else if(a==='sec-lanc') secLancar(el);
    else if(a==='sec-insp'){ fechar(); abrirInsp(); }
    else if(a==='reu-novo') reuAbrir('');
    else if(a==='reu-abrir') reuAbrir(id);
    else if(a==='reu-gravar') await reuGravar(el);
    else if(a==='reu-ditar') reuDitar(el);
    else if(a==='reu-trans') await reuTranscrever(el);
    else if(a==='reu-ata') await reuAta(el);
    else if(a==='reu-salvar') await reuSalvar(el);
    else if(a==='reu-imp') reuImp();
    else if(a==='reu-del'){ if(confirm('Excluir esta reunião e a ata?')){ await api('excluir', {aba:'Reunioes', id}); await recarregar(); fechar(); toast('Reunião excluída'); render(); } }
    else if(a==='reu-aud-rem'){ REU.blob = null; REU.audioId = ''; REU.audioNome = ''; $('#reu-aud').innerHTML = ''; }
    else if(a==='terc-sync'){
      if(!confirm('Ler as planilhas de terceiros de cada obra e atualizar o sistema? A planilha prevalece nos campos que ela tem (situação, documentos, integração). CPF nunca é lido.')) return;
      el.disabled = true; el.textContent = 'Lendo planilhas…';
      try{ const r = await api('importarTerceiros', {}); await recarregar(); render();
        toast(r.map(x => x.obra + ': ' + (x.erro ? x.erro : x.trabalhadores + ' trabalhador(es), ' + x.novos + ' novo(s)')).join(' | ')); }
      catch(err){ toast(err.message, true); el.disabled = false; el.textContent = '⟳ Atualizar das planilhas'; }
    }
    else if(a==='aval-auto') await avalAuto(id);
    else if(a==='iaf-tog'){ el.nextElementSibling.classList.toggle('hidden'); }
    else if(a==='iaf-go') await iaFormGo(el);
    else if(a==='insp-ia') await inspIA(el);
    else if(a==='ditar') ditar(el);
    else if(a==='ia-venc') await iaVenc(el);
    else if(a==='gsub'){ GSUB = el.dataset.s; render(); }
    else if(a==='gen-limpar'){ GEN.v = {}; GEN.html = ''; render(); }
    else if(a==='doc-imp') imprimirDoc(GEN.html);
    else if(a==='ia-novo'){ CHAT = []; render(); }
    else if(a==='ia-sug'){ $('#ia-q').value = el.dataset.q; iaEnviar(); }
    else if(a==='topo-tog'){ TOPO = !(TOPO === true); pintarTopo(); }
    else if(a==='rot-fazer') await rotinaFazer(el);
    else if(a==='lanc-novo') abrirLanc({obra:el.dataset.o, data:el.dataset.d});
    else if(a==='insp-nova') abrirInsp();
    else if(a==='insp-add') inspAdd();
    else if(a==='insp-rem'){ if(document.querySelectorAll('#insp-itens .ip').length > 1){ el.closest('.ip').remove(); inspNum(); } else toast('A inspeção precisa de pelo menos um item.', true); }
    else if(a==='insp-det') inspDetalhe(el.dataset.l);
    else if(a==='insp-res') inspResolver(id);
    else if(a==='insp-rel') await inspRelatorio(el.dataset.l);
    else if(a==='insp-env') inspEnviar(el.dataset.l);
    else if(a==='exc-termo'){ const x = DB.LiberacoesExc.find(y => y.id === id); if(x) imprimirDoc(excDoc(x)); }
    else if(a==='ir-exc'){ VIEW = 'terc'; TSUB = 'exc'; TFICHA = null; render(); window.scrollTo(0,0); }
    else if(a==='exc-nova') abrirForm('LiberacoesExc', null, {empresaId:el.dataset.e, empresa:el.dataset.n, obra:el.dataset.o});
    else if(a==='nsub'){ NSUB = el.dataset.s; render(); }
    else if(a==='tema-usar'){ const inp = document.querySelector('#lancf input[name="o_' + el.dataset.k + '"]'); if(inp){ inp.value = ('Tema: ' + el.dataset.t + (inp.value ? ' | ' + inp.value : '')).slice(0, 200); } }
    else if(a==='lanc-edit') abrirLanc({obra:el.dataset.o, data:el.dataset.d});
    else if(a==='lanc-del'){ if(confirm('Excluir este lançamento?')){ await api('excluir', {aba:'Atividades', id}); await recarregar(); render(); toast('Lançamento excluído'); } }
    else if(a==='aval-ciente'){ await api('ciencia', {id}); await recarregar(); render(); toast('Ciência registrada'); }
    else if(a==='backup-agora') await backupAgora(el);
    else if(a==='tsub'){ TSUB = el.dataset.s; TFICHA = null; render(); }
    else if(a==='terc-ficha'){ TFICHA = {tipo:el.dataset.t, id, prev:TFICHA}; render(); window.scrollTo(0,0); }
    else if(a==='terc-voltar'){ TFICHA = (TFICHA && TFICHA.prev) || null; render(); window.scrollTo(0,0); }
    else if(a==='conf-abrir') confAbrir(el.dataset.t, id);
    else if(a==='conf-todos'){ document.querySelectorAll('#cd-f tr[data-doc] [data-cd="status"]').forEach(s => { if(s.value === 'Pendente' || s.value === 'Aguardando'){ s.value = 'Aprovado'; confDataAuto(s); } }); }
    else if(a==='doc-lancar'){ const ref = el.dataset.aba === 'TercDocs' ? 'trabId' : 'empresaId'; abrirForm(el.dataset.aba, null, {[ref]:el.dataset.ref, doc:el.dataset.doc}); }
    else if(a==='trab-novo') abrirForm('Terceiros', null, {empresaId:id});
    else if(a==='trab-print') imprimirDoc(trabDoc(DB.Terceiros.find(x => x.id === id)));
    else if(a==='norma-ia') iaPergunta(id);
    else if(a==='norma-vista') await normaVista(id);
    else if(a==='normas-verificar') await normasVerificar(el);
    else if(a==='aval-ver') avalVer(id);
    else if(a==='aval-imp') imprimirDoc(avalDoc(DB.AvaliacoesTST.find(x => x.id === id)));
    else if(a==='recarregar'){ await recarregar(); render(); toast('Dados atualizados'); }
  }catch(err){ toast(err.message, true); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if(f.id === 'login-f') doLogin(f);
  else if(f.id === 'senha-f') doSenha(f);
  else if(f.id === 'frm') salvarForm(f);
  else if(f.id === 'lancf') salvarLanc(f);
  else if(f.id === 'inspf') salvarInspecao(f);
  else if(f.id === 'inspr') salvarResolucao(f);
  else if(f.id === 'inspe') enviarInsp(f);
  else if(f.id === 'cd-f') confSalvar(f);
  else if(f.id === 'gen-f') gerarDoc(f);
  else if(f.id === 'ia-f') iaEnviar();
});
function setF(t){
  const a = t.dataset.aba;
  (FL[a] = FL[a] || {q:'',obra:'',mes:''})[t.dataset.f] = t.value;
  const el = document.getElementById('tbl-'+a);
  if(el) el.innerHTML = tabela(a);
}
document.addEventListener('change', e => {
  const t = e.target;
  if(t.form && t.form.id === 'lancf' && (t.name === 'obra' || t.name === 'data')) lancRows();
  else if(t.form && t.form.id === 'lancf' && /^c_/.test(t.name)){
    const k = t.name.slice(2), v = t.value;
    document.querySelectorAll('#lancf [data-pk="' + k + '"]').forEach(el => { const verb = el.classList.contains('lverb'); el.classList.toggle('hidden', verb ? v !== 'Verbal' : v !== 'Anexo'); });
  }
  else if(t.dataset.iaf) onIafFoto(t);
  else if(t.dataset.reuaud) reuArquivo(t);
  else if(t.form && t.form.id === 'frm' && sugChange(t)) {}
  else if(t.dataset.cd === 'real') confValidAuto(t);
  else if(t.dataset.lf) onLancArq(t);
  else if(t.dataset.ip) onInspFoto(t);
  else if(t.dataset.ir){ const z = t.closest('.ip').querySelector('[name="prazo"]'); if(z && !z.dataset.man) z.value = addDias(hojeISO(), RISCO_DIAS[t.value] || 7); }
  else if(t.dataset.ipz) t.dataset.man = '1';
  else if(t.dataset.ig){ IF[t.dataset.ig] = t.value; render(); }
  else if(t.dataset.cg){ CF[t.dataset.cg] = t.value; render(); }
  else if(t.dataset.ts && t.type !== 'text'){ TS[t.dataset.ts] = t.value; render(); }
  else if(t.dataset.lg){ LF[t.dataset.lg] = t.value; render(); }
  else if(t.dataset.foto) onFoto(t);
  else if(t.dataset.arq) onArq(t);
  else if(t.dataset.gen){ GEN = {t:t.value, v:{}, html:''}; render(); }
  else if(t.dataset.bf){ BF[t.dataset.bf] = t.value; const el = $('#bib-tbl'); if(el) el.innerHTML = bibTabela(); }
  else if(t.name === 'tipo' && t.form && t.form.dataset.aba === 'RegistrosSeg'){
    const pi = t.form.querySelector('input[name="pontos"]'); if(pi && PTS[t.value] !== undefined) pi.value = PTS[t.value];
  }
  else if(t.dataset.g){ F[t.dataset.g] = t.value; render(); }
  else if(t.dataset.p){ PF[t.dataset.p] = t.value; render(); }
  else if(t.dataset.cd === 'status') confDataAuto(t);
  else if(t.id === 'cd-st'){ const d1 = $('#cd-dav'), d2 = $('#cd-dlib'); if(t.value !== 'Aguardando liberação' && d1 && !d1.value) d1.value = hojeISO(); if(ehAprov(t.value) && d2 && !d2.value) d2.value = hojeISO(); }
  else if(t.dataset.tf && t.tagName === 'SELECT'){ TF[t.dataset.tf] = t.value; if(t.dataset.tf === 'obra') TF.emp = ''; render(); }
  else if(t.dataset.nf && t.tagName === 'SELECT'){ NF[t.dataset.nf] = t.value; const el = $('#norm-tbl'); if(el) el.innerHTML = normasTabela(); }
  else if(t.dataset.f && t.tagName === 'SELECT') setF(t);
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset && t.dataset.auto && t.type === 'date') delete t.dataset.auto;
  if(t.dataset.ts === 'q'){ TS.q = t.value; const el = $('#temas-banco'); if(el) el.innerHTML = temasBanco(); return; }
  if(t.form && t.form.id === 'lancf' && /^q_/.test(t.name)){ const bl = document.querySelector('#lancf .lcomp[data-k="' + t.name.slice(2) + '"]'); if(bl) bl.classList.toggle('hidden', !(Number(t.value) > 0)); return; }
  if(t.dataset.bf && t.tagName === 'INPUT'){ BF[t.dataset.bf] = t.value; const el = $('#bib-tbl'); if(el) el.innerHTML = bibTabela(); }
  else if(t.dataset.tf && t.tagName === 'INPUT'){ TF[t.dataset.tf] = t.value; const el = $('#terc-tbl'); if(el) el.innerHTML = TSUB === 'emp' ? empTabela() : trabTabela(); }
  else if(t.dataset.nf && t.tagName === 'INPUT'){ NF[t.dataset.nf] = t.value; const el = $('#norm-tbl'); if(el) el.innerHTML = normasTabela(); }
  else if(t.dataset.f && t.tagName === 'INPUT') setF(t);
});
window.addEventListener('beforeprint', () => charts.forEach(c => c.resize()));

document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.id === 'ia-q'){ e.preventDefault(); iaEnviar(); }
});

/* ================================== início ================================== */
(async () => {
  if(TOKEN){ try{ await entrar(); return; }catch(e){} }
  mostrarLogin();
})();
</script>
</body>
</html>
