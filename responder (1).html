<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Resposta da inspeção</title>
<style>
:root{--bg:#f4f6f4;--card:#fff;--ink:#1c2a22;--mut:#5f6f66;--line:#d9e0db;--brand:#1f3d2f;--ok:#2e7d32;--warn:#b26a00;--bad:#c62828}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
header{background:var(--brand);color:#fff;padding:14px 16px}
header h1{margin:0;font-size:1.1rem}header p{margin:2px 0 0;font-size:.85rem;opacity:.85}
main{max-width:760px;margin:0 auto;padding:14px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.card.feito{border-left:5px solid var(--ok)}.card.pend{border-left:5px solid var(--warn)}.card.venc{border-left:5px solid var(--bad)}
h2{font-size:1rem;margin:0 0 6px}
.mut{color:var(--mut);font-size:.86rem}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.74rem;font-weight:600;color:#fff;background:#8a948e;margin-right:4px}
.chip.ok{background:var(--ok)}.chip.warn{background:var(--warn)}.chip.bad{background:var(--bad)}
label{display:block;font-size:.85rem;font-weight:600;margin:10px 0 3px}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
button{font:inherit;border:0;border-radius:8px;padding:11px 16px;background:var(--brand);color:#fff;font-weight:600;cursor:pointer}
button:disabled{opacity:.6}
.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
img.f{max-width:100%;max-height:260px;border-radius:8px;border:1px solid var(--line);display:block;margin:6px 0}
.erro{background:#fdeeee;color:var(--bad);border:1px solid #f1bcbc;border-radius:10px;padding:12px;margin:14px 0}
.ok{color:var(--ok)}
.sit{display:flex;gap:8px;margin:8px 0}.sit label{flex:1;margin:0;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:9px;display:flex;align-items:center;gap:6px}
.sit input{width:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.grid2{grid-template-columns:1fr}}
footer{max-width:760px;margin:0 auto;padding:0 16px 30px;color:var(--mut);font-size:.78rem}
</style>
</head>
<body>
<header><h1>Resposta da inspeção de segurança</h1><p id="sub">Carregando…</p></header>
<main id="app"></main>
<footer>Este link é pessoal e vale por tempo limitado. Ele mostra somente os itens designados a você nesta inspeção e não dá acesso a nenhum outro dado do sistema.</footer>
<script>
const Q = new URLSearchParams(location.search), TOKEN = Q.get('t') || '', API = Q.get('a') || '';
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const br = d => d ? String(d).split('-').reverse().join('/') : '—';
const hoje = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const dias = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5);
let DADOS = null, FOTOS = {};
async function api(acao, extra) {
  if (!/^https:\/\/script\.google\.com\//.test(API)) throw new Error('Link incompleto. Peça um novo link a quem enviou.');
  let j;
  try { const r = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ acao, token: TOKEN }, extra || {})) }); j = await r.json(); }
  catch (e) { throw new Error('Sem conexão com o servidor. Verifique a internet e tente de novo.'); }
  if (!j.ok) throw new Error(j.erro || 'Erro.');
  return j.data;
}
const chip = (t, c) => `<span class="chip ${c || ''}">${esc(t)}</span>`;
const corR = r => /alto|grave|cr[ií]tico/i.test(r) ? 'bad' : /m[eé]dio/i.test(r) ? 'warn' : 'ok';
function comprimir(file) {
  return new Promise((ok, er) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const m = 1280, k = Math.min(1, m / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.78)); };
    img.onerror = () => er(new Error('Não foi possível ler a foto.')); img.src = url;
  });
}
function lembrado() { try { return localStorage.getItem('qsms_gestor') || ''; } catch (e) { return ''; } }
function itemHTML(x, i) {
  const feito = x.status === 'Concluída', d = dias(x.prazo, hoje()), venc = !feito && d > 0;
  let h = `<div class="card ${feito ? 'feito' : venc ? 'venc' : 'pend'}" id="it-${esc(x.id)}"><h2>${i + 1}. ${esc(x.achado)}</h2>
    <div>${chip(x.risco, corR(x.risco))}${chip(x.status, feito ? 'ok' : venc ? 'bad' : 'warn')}${x.nr ? chip(x.nr) : ''}</div>
    <p class="mut">${x.porque ? 'Por quê: ' + esc(x.porque) + '<br>' : ''}Prazo: <b>${br(x.prazo)}</b>${venc ? ' <b style="color:var(--bad)">(' + d + ' dia(s) de atraso)</b>' : ''}</p>
    ${x.solucaoProposta ? `<p><b>Solução sugerida pelo inspetor:</b> ${esc(x.solucaoProposta)}</p>` : ''}
    ${x.fotoAntes ? `<div data-foto="${esc(x.id)}|antes"><span class="mut">Carregando foto…</span></div>` : ''}${Array.from({length: x.nExtra || 0}, (_, n) => `<div data-foto="${esc(x.id)}|extra${n + 1}"></div>`).join('')}`;
  if (feito) h += `<p class="ok"><b>Concluído em ${br(x.dataSolucao)}</b>${x.resolvidoPor ? ' por ' + esc(x.resolvidoPor) : ''}.</p><p>${esc(x.solucao)}</p>${x.fotoDepois ? `<div data-foto="${esc(x.id)}|depois"><span class="mut">Carregando foto…</span></div>` : ''}`;
  else h += `${x.solucao ? `<p class="mut">Último registro: ${esc(x.solucao)}</p>` : ''}
    <form data-id="${esc(x.id)}">
      <div class="sit"><label><input type="radio" name="sit" value="concluir" checked> Já resolvi</label><label><input type="radio" name="sit" value="andamento"> Em andamento</label></div>
      <label>O que foi feito (ou o que falta fazer)</label><textarea name="solucao" required maxlength="1500" placeholder="Ex.: Instalado guarda-corpo conforme a NR-18 e liberada a área."></textarea>
      <div class="grid2"><div class="c-data"><label>Data em que foi resolvido</label><input type="date" name="data" max="${hoje()}" value="${hoje()}"></div>
        <div class="c-prazo" style="display:none"><label>Novo prazo (opcional)</label><input type="date" name="prazo" min="${hoje()}"></div></div>
      <label>Foto do depois (opcional, use a câmera)</label><input type="file" name="foto" accept="image/*" capture="environment">
      <p><button type="submit">Enviar</button> <span class="mut msg"></span></p></form>`;
  return h + '</div>';
}
function paint() {
  const D = DADOS, ab = D.itens.filter(x => x.status !== 'Concluída').length;
  $('#sub').textContent = `${D.obra} • inspeção de ${br(D.data)}${D.local ? ' • ' + D.local : ''}`;
  $('#app').innerHTML = `<div class="card"><h2>Olá, ${esc(D.responsavel)}</h2><p class="mut">Inspetor: ${esc(D.inspetor)}. ${D.itens.length} item(ns) para você: <b>${ab} pendente(s)</b>. Para cada item, diga o que foi feito, a data e, se puder, anexe uma foto.</p>
    <label>Seu nome (quem está respondendo)</label><input id="quem" value="${esc(lembrado() || D.responsavel)}" maxlength="80"></div>` + D.itens.map(itemHTML).join('');
  document.querySelectorAll('[data-foto]').forEach(async el => {
    const [id, qual] = el.dataset.foto.split('|');
    try { const r = await api('respFoto', { id, qual }); el.innerHTML = `<img class="f" alt="Foto" src="data:${r.mime};base64,${r.b64}">`; } catch (e) { el.innerHTML = '<span class="mut">Foto indisponível.</span>'; }
  });
}
document.addEventListener('change', e => {
  if (e.target.name === 'sit') { const f = e.target.form, c = e.target.value === 'concluir'; f.querySelector('.c-data').style.display = c ? '' : 'none'; f.querySelector('.c-prazo').style.display = c ? 'none' : ''; }
});
document.addEventListener('submit', async e => {
  const f = e.target; if (!f.dataset.id) return; e.preventDefault();
  const btn = f.querySelector('button'), msg = f.querySelector('.msg'), fd = new FormData(f), nome = ($('#quem').value || '').trim();
  if (nome.length < 3) { msg.textContent = 'Informe o seu nome no alto da página.'; msg.style.color = 'var(--bad)'; $('#quem').focus(); return; }
  btn.disabled = true; msg.style.color = ''; msg.textContent = 'Enviando…';
  try {
    const x = { id: f.dataset.id, nome, situacao: fd.get('sit'), solucao: fd.get('solucao'), dataSolucao: fd.get('data'), novoPrazo: fd.get('prazo') || '' };
    const file = f.querySelector('input[type=file]').files[0];
    if (file) { msg.textContent = 'Enviando a foto…'; const d = await comprimir(file); x.b64 = d.split(',')[1]; x.mime = 'image/jpeg'; }
    await api('respSalvar', x);
    try { localStorage.setItem('qsms_gestor', nome); } catch (er) {}
    DADOS = await api('respGet'); paint();
    const el = document.getElementById('it-' + x.id); if (el) el.scrollIntoView({ block: 'center' });
  } catch (err) { msg.textContent = err.message; msg.style.color = 'var(--bad)'; btn.disabled = false; }
});
(async () => {
  try { if (!TOKEN) throw new Error('Link inválido.'); DADOS = await api('respGet'); paint(); }
  catch (e) { $('#sub').textContent = 'Não foi possível abrir'; $('#app').innerHTML = `<div class="erro"><b>${esc(e.message)}</b></div>`; }
})();
</script>
</body>
</html>
