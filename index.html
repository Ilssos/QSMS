<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QSMS">
<meta name="theme-color" content="#000000">
<title>Sistema QSMS Machine</title>
<style>
:root{
  --bg:#F3F2EE; --card:#fff; --ink:#1f2421; --muted:#6b706b; --line:#e3e1da;
  --ok:#2e7d4f; --warn:#d98e04; --bad:#c0392b; --info:#2f5d8a; --accent:#1f3d2f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4}
.hidden{display:none!important}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:380px}
.login h1{font-size:1.2rem;color:var(--accent)}
.login p{color:var(--muted);font-size:.85rem;margin:4px 0 18px}
.erro{color:var(--bad);font-size:.85rem;min-height:1.2em;margin-bottom:8px}

/* cabeçalho e navegação */
header{background:var(--accent);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header h1{font-size:1.1rem}
header small{opacity:.8;display:block;font-size:.78rem}
.hdr-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.8rem}
header .btn{background:rgba(255,255,255,.15);padding:6px 12px;font-size:.78rem}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px 20px;background:var(--bg);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
nav a{white-space:nowrap;cursor:pointer;color:var(--ink);background:var(--card);border:1px solid var(--line);padding:6px 14px;border-radius:99px;font-size:.85rem}
nav a.on{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:1200px;margin:0 auto;padding:20px}
h2{font-size:1rem;margin:26px 0 10px;color:var(--accent)}
h2:first-child{margin-top:0}

/* formulários e botões */
label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:12px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink);margin-top:4px}
textarea{resize:vertical}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;font-size:.88rem;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:4px 10px;font-size:.76rem;font-weight:500}
.btn:disabled{opacity:.6;cursor:wait}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:0 0 14px}
.toolbar label{margin:0;min-width:150px;flex:0 1 220px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:20}
.box{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:680px;margin:auto}
.box h3{margin-bottom:14px;color:var(--accent)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.fgrid .wide{grid-column:1/-1}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:.85rem;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#toast.err{background:var(--bad)}

/* cartões, kpis, tabelas */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi small{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
.kpi b{display:block;font-size:1.8rem;margin:4px 0 2px}
.kpi span{font-size:.75rem;color:var(--muted)}
.sec-fab{position:fixed;right:16px;bottom:16px;z-index:60;border-radius:999px;padding:12px 16px;box-shadow:0 4px 14px #0004}
.sec-fab .bd{background:#c62828;color:#fff;border-radius:999px;font-size:.7rem;padding:1px 6px;margin-left:6px}
.sec-box{position:fixed;right:16px;bottom:70px;width:min(380px,calc(100vw - 32px));height:min(520px,70vh);z-index:61;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px #0005;display:flex;flex-direction:column;overflow:hidden}
.sec-box.hidden{display:none}
.sec-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.sec-h b{flex:1}.sec-h small{color:var(--muted);font-size:.72rem}
.sec-log{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.sec-m{max-width:88%;padding:8px 10px;border-radius:12px;font-size:.88rem;white-space:pre-wrap;background:var(--bg,#eee)}
.sec-m.u{align-self:flex-end;background:#dbeafe;color:#102a43}
.sec-m .acs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sec-in{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
.sec-in textarea{flex:1;resize:none;height:42px}
.sec-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 6px}
.rec{background:#c62828 !important;color:#fff !important}
.iabox{margin:10px 0;padding:10px;border:1px dashed var(--line);border-radius:10px;background:var(--card)}
.iabox textarea{width:100%;margin:8px 0}
.iarow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.iarow label.btn{cursor:pointer;margin:0}
.iasug{outline:2px solid #7c5cff55;background:#f4f0ff !important}
.sug{display:block;font-size:.74rem;color:var(--muted);margin-top:3px}
.sug a,.sug button{margin-left:6px}
.cap{margin:8px 0 0;font-size:.78rem;color:var(--muted);text-align:center}
.kpi.ok b{color:var(--ok)} .kpi.warn b{color:var(--warn)} .kpi.bad b{color:var(--bad)}
.d{display:block;font-style:normal;font-size:.7rem;margin-top:3px;color:var(--muted)}
.d.up{color:var(--ok)} .d.dn{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;overflow-x:auto}
.card h3{font-size:.9rem;margin-bottom:10px;color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:.7rem;text-transform:uppercase}
td:first-child,th:first-child{text-align:left}
table.crud td,table.crud th{text-align:left}
td.txt{white-space:normal;min-width:200px;max-width:340px}
tr.total td{font-weight:700;background:#faf9f6}
.cont,.vazio{font-size:.78rem;color:var(--muted);margin-top:8px}
.nota{background:#eef3f8;border:1px solid #cbd9e8;color:#27486b;border-radius:10px;padding:10px 14px;font-size:.82rem;margin-bottom:14px}
.topo{margin:12px 20px 0;border:1px solid var(--line);border-left-width:8px;border-radius:12px;background:var(--card,#fff);padding:10px 14px}
.topo.bad{border-color:#e0a49b;border-left-color:var(--bad);background:#fdf1ef}.topo.warn{border-color:#f1d29a;border-left-color:var(--warn);background:#fff8ea}.topo.ok{border-color:#b5d9c1;border-left-color:var(--ok);background:#eef7f1}
.topo-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.9rem}.topo-b{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px 24px;margin-top:10px}
.topo-s h4{margin:0 0 4px;font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tg{display:inline-block;border-radius:99px;padding:3px 10px;font-size:.78rem;font-weight:700;color:#fff;background:var(--muted)}.tg.ok{background:var(--ok)}.tg.warn{background:var(--warn)}.tg.bad{background:var(--bad)}
.pills{display:flex;flex-wrap:wrap;gap:6px}.rp{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:4px 8px;font-size:.8rem;border:1px solid}.rp em{font-style:normal;opacity:.75}
.rp.ok{background:#e8f4ec;border-color:#b5d9c1;color:#1f5a37}.rp.warn{background:#fff4e0;border-color:#f1d29a;color:#7a5200}.rp.bad{background:#fdecea;border-color:#f2b8b0;color:#8a2218}
.vl{list-style:none;margin:0;padding:0;font-size:.82rem}.vl li{padding:2px 0 2px 10px;border-left:4px solid var(--warn);margin:3px 0}.vl li.bad{border-left-color:var(--bad)}
.lk{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}.lk:hover{text-decoration:underline}.vl2{list-style:none;margin:0 0 8px;padding:0;font-size:.85rem}.vl2 li{margin:3px 0}
.avrow{display:flex;align-items:center;gap:10px;margin:4px 0}.avl{width:230px;font-size:.85rem}.avrow .bar{flex:1}.avv{width:28px;text-align:right;font-weight:700}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%}
.stack{display:flex;height:14px;border-radius:6px;overflow:hidden;background:var(--line);min-width:140px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.75rem;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
.qrc{margin:10px 0;padding:10px}.qrc.qerr{outline:2px solid #c62828}.qh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.qdocs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:8px 0}.qd{border:1px solid var(--line,#d9ded9);border-radius:8px;padding:6px}.qd label{margin:0}
.qd-ok{border-color:#2e7d32;background:#f1f8f1}.qd-warn{border-color:#b26a00;background:#fff7e8}.qd-bad{border-color:#c62828;background:#fdeeee}.qm{width:100%;margin-top:4px}.qm.qerr{border-color:#c62828}
.pill,.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.74rem;font-weight:600;color:#fff;background:var(--gray,#9aa09a)}
.chip.ok{background:var(--ok)} .chip.warn{background:var(--warn)} .chip.bad{background:var(--bad)} .chip.info{background:var(--info)}
.alert{background:#fff4e0;border:1px solid #f1d29a;color:#7a5200;border-radius:10px;padding:10px 14px;font-size:.85rem;margin-bottom:8px}
.alert.bad{background:#fdecea;border-color:#f2b8b0;color:#8a2218}
.alert.good{background:#e8f4ec;border-color:#b5d9c1;color:#1f5a37}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.chart{position:relative;height:270px}
.pir{width:100%;max-width:680px;color:var(--ink)}
.print-head{display:none}


/* fotos, arquivos, galeria */
.foto{margin-bottom:12px}
.flab{display:block;font-size:.78rem;color:var(--muted)}
.fprev{margin:6px 0;font-size:.82rem;color:var(--muted)}
.fprev img{max-width:220px;max-height:160px;border-radius:8px;display:block}
.facts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.facts input[type=file]{width:auto;flex:1;min-width:0}
.box.wide-box{max-width:960px}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.gal figure{margin:0}
.gal img{width:100%;border-radius:8px;display:block}
.gal figcaption{font-size:.78rem;color:var(--muted);margin-top:4px}
.gimg{min-height:80px;background:var(--bg);border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:.8rem}
/* chat da IA */
#chat-log{max-height:60vh;overflow-y:auto;margin-bottom:12px}
.msg{padding:10px 12px;border-radius:10px;margin-bottom:10px;font-size:.88rem}
.msg.user{background:#eaf1ea;white-space:pre-wrap}
.msg.assistant{background:#faf9f6;border:1px solid var(--line)}
.msg b.who{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.msg h4{margin:10px 0 4px;color:var(--accent);font-size:.9rem}
.msg ul,.msg ol{margin:6px 0 6px 20px}
.msg p{margin:4px 0}
.msg code{background:#eee;padding:1px 5px;border-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chk{display:flex;gap:8px;align-items:center}
.chk input{width:auto;margin:0}
/* documentos gerados */
#docprint{display:none}
.docbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;overflow-x:auto;margin-top:12px}
.doc{color:#111;font-size:.82rem;min-width:640px;background:#fff}
.doc-h{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid #1f3d2f;padding-bottom:8px;margin-bottom:12px}
.doc-emp{font-size:1.2rem;font-weight:800;color:#1f3d2f;letter-spacing:.04em;text-transform:uppercase}
.doc-sub{font-size:.72rem;color:#555}
.doc-t{text-align:right}
.doc-t h1{font-size:1.05rem;margin:0}
.doc-t p{font-size:.72rem;color:#555;margin:2px 0 0}
.doc-s{font-size:.82rem;text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px;color:#1f3d2f}
.doc-p{margin:0 0 6px}
.doc table{width:100%;border-collapse:collapse}
.doc-kv th,.doc-kv td,.doc-t2 th,.doc-t2 td{border:1px solid #999;padding:5px 7px;text-align:left;vertical-align:top;white-space:normal;font-size:.78rem}
.doc-kv th,.doc-t2 th{background:#eee;color:#111;font-weight:700;text-transform:none;font-size:.74rem;width:auto}
.doc-kv th{width:14%}
.doc-t2 td{min-height:24px}
.doc-t2 td.c{text-align:center;width:44px}
.doc-ass{display:flex;gap:28px;margin-top:34px;flex-wrap:wrap}
.doc-ass>div{flex:1;min-width:150px;text-align:center;font-size:.74rem}
.doc-ass .linha{border-bottom:1px solid #111;height:30px;margin-bottom:4px}
.doc-rod{margin-top:18px;font-size:.68rem;color:#666;border-top:1px solid #ccc;padding-top:6px}
.doc-logo{height:38px;display:block;margin-bottom:4px}
.cl{display:inline-block;border-bottom:1px solid #111;height:1em;vertical-align:baseline}
.cert{color:#111;background:#fff;font-size:12.5pt;line-height:1.5;padding:6mm 8mm;min-height:250mm;page-break-after:always;border:1px solid #ddd;margin-bottom:10px}
.cert:last-child{page-break-after:auto}
.cert-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10mm}
.cert-logo{height:46px}.cert-nr{height:70px}
.cert h1{text-align:center;font-size:22pt;letter-spacing:.25em;margin:0 0 8mm}
.cert p{margin:0 0 4mm;text-align:justify}.cert ul{margin:0 0 4mm 6mm;padding-left:5mm}
.cert-data{margin-top:8mm!important;text-align:right!important}
.cert-ass{display:flex;gap:16mm;margin-top:22mm;text-align:center;font-size:11pt}.cert-ass>div{flex:1}.cert-ass .ln{border-bottom:1px solid #111;height:10mm;margin-bottom:2mm}
.cert-ass35{margin-top:14mm}.cert-ass35 p{text-align:left;margin-bottom:6mm}
.os{color:#111;background:#fff;font-size:9.5pt;line-height:1.35;page-break-after:always}
.os table{width:100%;border-collapse:collapse;margin-bottom:-1px}
.os th,.os td{border:1px solid #111;padding:4px 7px;text-align:left;vertical-align:top;white-space:normal;font-size:9.5pt}
.os th{background:#e6e6e6;text-align:center;font-weight:700;text-transform:uppercase;color:#111;font-size:9.5pt}
.os th.sub{background:#f3f3f3;text-transform:none}.os td.c{text-align:center}
.os-h td{height:18mm;vertical-align:middle;text-align:center}.os-lg{width:28%}.os-lg img{height:42px}.os-tt{font-weight:800;font-size:12pt}.os-nr{width:18%;font-weight:700}
@media print{
  body.print-doc>*:not(#docprint){display:none!important}
  body.print-doc #docprint{display:block}
  body.print-doc .doc{min-width:0}
  body.print-doc .cert{border:0;margin:0}
}
@page{size:A4;margin:12mm}
@media print{
  body{background:#fff}
  header,nav,.toolbar,.btn,#toast,.modal{display:none!important}
  main{padding:0;max-width:none}
  .print-head{display:block;margin-bottom:12px}
  .print-head h1{font-size:1.3rem;color:var(--accent)}
  .kpi,.card,.alert{break-inside:avoid}
  .kpi,.card,.bar i,.stack i,.chip,.pill,svg{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}


/* topo compacto, lançamento do dia */
.topo,.topo.bad,.topo.warn,.topo.ok{background:var(--card);border:1px solid var(--line);border-left-width:5px;padding:8px 12px}
.topo.bad{border-left-color:var(--bad)}.topo.warn{border-left-color:var(--warn)}.topo.ok{border-left-color:var(--ok)}
.topo-h{gap:8px 12px;flex-wrap:wrap}.tdata{font-weight:700;font-size:.86rem;text-transform:none}.tags{display:flex;gap:6px;flex-wrap:wrap;order:3;flex-basis:100%}
.tg{font-size:.72rem;padding:2px 9px}.topo-r{margin-left:auto;display:flex;gap:8px;align-items:center;order:2}
.topo-b{border-top:1px solid var(--line);padding-top:10px;margin-top:8px}
.lrow{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;display:grid;grid-template-columns:1fr 110px;gap:4px 12px;align-items:end;background:#fff}
.lrow.feito{border-color:#b5d9c1;background:#f6fbf8}.lrow .lt{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lrow label{margin:0}.lrow .lfile,.lrow .lobs{grid-column:1/-1}.lrow .lfile .fprev{margin:2px 0 4px}
.ev{font-size:.68rem;background:#fff4e0;color:#7a5200;border:1px solid #f1d29a;border-radius:99px;padding:1px 8px;font-weight:600}
.chkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 10px;margin:6px 0}
.tacoes{margin-bottom:8px}
@media (max-width:700px){.topo-r{width:100%}.topo-r .btn:not(.sm){flex:1}.lrow{grid-template-columns:1fr 90px}}

.radios{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:2px 0 6px}.radios .chk{margin:0;font-size:.82rem;color:var(--ink)}.radios .chk input{width:auto;margin:0 4px 0 0}
.lcomp{border-top:1px dashed var(--line);padding-top:6px}.ip{background:#fcfcfa}
/* celular */
.charts{grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}
.topo-b{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
button,.btn,nav a{touch-action:manipulation}
@media (max-width:700px){
  input,select,textarea{font-size:16px;padding:11px 10px}
  header{padding:10px 14px}
  header h1{font-size:1rem}
  .hdr-r{width:100%;justify-content:space-between}
  nav{padding:10px 14px;gap:6px;-webkit-overflow-scrolling:touch}
  nav a{padding:9px 14px;font-size:.88rem}
  main{padding:14px}
  .topo{margin:10px 14px 0;padding:10px 12px}
  .topo-h{font-size:.85rem}
  .rp{padding:8px 10px;font-size:.84rem;flex-wrap:wrap;gap:2px 8px;width:100%}
  .rp .btn{margin-left:auto}
  .pills{flex-direction:column}
  .rp .btn.sm,.vl2 .btn.sm,.card .btn.sm{padding:8px 12px;font-size:.82rem}
  .btn{padding:12px 16px}
  .toolbar{gap:8px}
  .toolbar label{flex:1 1 140px;min-width:0}
  .modal{padding:0;align-items:stretch}
  .box{border-radius:0;max-width:none;min-height:100%;padding:16px}
  .acts{position:sticky;bottom:0;background:var(--card);padding:10px 0;border-top:1px solid var(--line);margin-top:12px}
  .acts .btn{flex:1}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi b{font-size:1.5rem}
  .card{padding:12px}
  .chart{height:230px}
  .avrow{flex-wrap:wrap}.avl{width:100%}
  .gal{grid-template-columns:1fr 1fr}
  .fprev img{max-width:100%}
  .doc{min-width:560px}
  #toast{left:14px;right:14px;transform:none;text-align:center;border-radius:12px;bottom:16px}
  #chat-log{max-height:50vh}
  td.txt{min-width:160px}
}
@media (max-width:380px){.grid{grid-template-columns:1fr}}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}.th{position:relative}.th img{width:84px;height:84px;object-fit:cover;border-radius:6px;border:1px solid #d9e0db;display:block}.th button{position:absolute;top:2px;right:2px;border:0;border-radius:50%;width:22px;height:22px;background:#c62828;color:#fff;cursor:pointer;line-height:1}.ip [hidden]{display:none!important}

/* identidade visual Machine (preto + azul, como no painel Carteira de obras) */
:root{--accent:#154cb0;--bg:#f4f6fa;--line:#e1e5ee}
header{background:#000;border-bottom:4px solid var(--accent)}
header .brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header .brand img{height:36px;display:block}
header .brand small{margin:0;letter-spacing:.06em;text-transform:uppercase;font-size:.68rem;opacity:.75}
.login .logo{display:block;height:44px;margin:0 auto 14px}
.login form{border-top:4px solid var(--accent)}
.login h1{text-align:center;color:#000;font-size:1.05rem;letter-spacing:.04em}
main table:not(.doc-kv):not(.doc-t2) thead th{background:#000;color:#fff;font-weight:600;letter-spacing:.03em}
main table:not(.doc-kv):not(.doc-t2) tbody tr:nth-child(even){background:#f6f8fc}
main table:not(.doc-kv):not(.doc-t2) tbody tr.total{background:#e8eefb}
h2{text-transform:uppercase;letter-spacing:.08em;font-size:.8rem;border-bottom:2px solid var(--accent);padding-bottom:5px}
nav a.on{background:#000;border-color:#000}
.logo-ph{display:none}

/* galeria de gráficos da visão geral */
.galbar{align-items:center;gap:6px;margin-bottom:12px}.galspace{flex:1}
.charts>[hidden]{display:none!important}
.charts.solo{grid-template-columns:1fr}
.charts.solo .chart{height:min(62vh,540px)}
.charts.solo .card svg{max-height:62vh}
#gal:fullscreen{background:var(--bg);padding:20px;overflow:auto}
#gal:fullscreen .charts.solo .chart{height:72vh}
/* ===== v22 ===== */
.tg.em{background:#7a4b00}.row-em td{background:#fff6dc}.row-em td:first-child{border-left:5px solid #f0a000}
.chip.em{font-weight:800;letter-spacing:.3px}
.mut{color:var(--mut,#5b6572);font-size:.86rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.fm{font-family:Arial,Helvetica,sans-serif;font-size:8.5pt;color:#000}
.fm table{width:100%;border-collapse:collapse;margin:0 0 -1px;table-layout:auto}
.fm td,.fm th{border:1px solid #000;padding:2px 5px;vertical-align:top;word-break:break-word}
.fm th{background:#d9d9d9;color:#000;text-align:center;font-weight:700}
.fm td.c,.fm th.c{text-align:center}
.fm-pg{page-break-after:always;break-after:page}
.fm-h td{height:16mm;vertical-align:middle;text-align:center}.fm-lg{width:24%}.fm-lg img{height:40px}.fm-tt{font-weight:800;font-size:11pt}.fm-cd{width:20%;font-weight:700;font-size:8pt}
.fm-g td{background:#efefef}.fm-n{font-size:7.5pt;margin:4px 0}
.fm-pt-l td{border:0;padding:1px 4px}
.fm td,.fm th{white-space:normal!important;min-width:0}.fm-apr-t{table-layout:fixed;width:100%!important}.fm-apr-t td{font-size:8pt;overflow-wrap:anywhere}.fm{width:100%;max-width:100%;box-sizing:border-box}.fm-apr{max-width:285mm}
.cb{font-family:"Segoe UI Symbol","DejaVu Sans",sans-serif;font-size:10pt}
.adv-fotos{display:grid;grid-template-columns:1fr 1fr;gap:8px}.adv-fotos figure{margin:0;border:1px solid #999;padding:4px;break-inside:avoid}.adv-fotos img{width:100%;max-height:70mm;object-fit:contain}.adv-fotos figcaption{font-size:8pt;text-align:center}
#slide{position:fixed;inset:0;z-index:99999;background:#07111f;color:#fff;display:flex;flex-direction:column;font-family:system-ui,Arial,sans-serif}
#slide .sl-top{display:flex;justify-content:space-between;padding:12px 24px;background:#000;font-size:1rem;opacity:.9}
#slide .sl-box{flex:1;display:flex;flex-direction:column;justify-content:center;padding:2vh 8vw;animation:slin .5s ease both;overflow:auto}
#slide h1{font-size:clamp(1.8rem,4.6vw,3.6rem);margin:.2em 0 .5em;color:#ffd24a}
#slide ul{font-size:clamp(1.2rem,2.9vw,2.2rem);line-height:1.35;padding-left:1.2em}
#slide li{margin:.35em 0;opacity:0;animation:slin .6s ease both}
#slide .sl-i{font-size:clamp(3rem,9vw,7rem)}
#slide .sl-s{font-size:clamp(1rem,2vw,1.6rem);opacity:.85}
#slide .sl-n{margin-top:2vh;padding:12px 16px;background:#13294a;border-left:6px solid #ffd24a;font-size:clamp(.95rem,1.6vw,1.3rem)}
#slide .sl-qr{background:#fff;padding:14px;border-radius:12px;width:min(46vh,60vw);margin:10px 0}
#slide .sl-bar{display:flex;gap:10px;flex-wrap:wrap;padding:10px 20px;background:#000;align-items:center}
#slide .sl-bar button,#slide .sl-bar a{background:#154cb0;color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer;text-decoration:none}
@keyframes slin{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.chip.em{background:#fff1c9;color:#7a4b00;border:1px solid #f0c75a}
</style>

<script>
/* =====================================================================
   CONFIGURAÇÃO: cole aqui a URL do Aplicativo da Web (termina em /exec)
   ===================================================================== */
const API_URL = "https://script.google.com/macros/s/AKfycbxb1adFGc3bVWzL3gbTyjBZQBHVm-k5F-WQCXegml1g_Gv_VDbvBIao8uHui6WpsWf3/exec";

/* ============================ utilitários ============================ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isNaN(n) ? 0 : n; };
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const hojeISO = () => iso(new Date());
const mesISO = () => hojeISO().slice(0,7);
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const nomeMes = m => { if(!m || m.length<7) return m||''; const [y,mm]=m.split('-'); return (MESES[+mm-1]||mm)+' '+y; };
const addMes = (m,n) => { const [y,mm]=m.split('-').map(Number); return iso(new Date(y,mm-1+n,1)).slice(0,7); };
const brData = d => d ? String(d).split('-').reverse().join('/') : '';
const diasEntre = (a,b) => Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 864e5);
const pct = (a,b) => b>0 ? a/b*100 : null;
const fmtP = v => v===null||v===undefined ? '—' : v.toFixed(1).replace('.',',')+'%';
const corP = v => v===null ? 'var(--line)' : v>=80?'var(--ok)':v>=60?'var(--warn)':'var(--bad)';
const clsP = v => v===null ? '' : v>=80?'ok':v>=60?'warn':'bad';

async function apiRaw(acao, extra={}){
  if(!API_URL || API_URL.startsWith('COLE_AQUI')) throw new Error('Configure a constante API_URL no início do script (veja o LEIA-ME).');
  let j;
  try{
    // Sem cabeçalho Content-Type: evita o preflight CORS que o Apps Script não responde.
    const r = await fetch(API_URL, {method:'POST', body: JSON.stringify({acao, token:TOKEN, ...extra})});
    j = await r.json();
  }catch(e){ const er = new Error('Não foi possível falar com o servidor. Verifique a conexão e a URL da API.'); er.rede = true; throw er; }
  if(!j.ok){
    if(j.erro === 'SESSAO'){ const er = new Error('Sessão expirada. Entre novamente.'); er.sessao = true; sair(true); throw er; }
    throw new Error(j.erro);
  }
  return j.data;
}

const IDB = {
  db:null,
  abrir(){ return new Promise((ok, er) => { if(this.db) return ok(this.db); let r; try{ r = indexedDB.open('qsms', 1); }catch(e){ return er(e); }
    r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => { this.db = r.result; ok(this.db); }; r.onerror = () => er(r.error); }); },
  async get(k){ try{ const d = await this.abrir(); return await new Promise((ok, er) => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => ok(q.result); q.onerror = () => er(q.error); }); }catch(e){ return undefined; } },
  async set(k, v){ try{ const d = await this.abrir(); await new Promise((ok, er) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = ok; t.onerror = () => er(t.error); }); }catch(e){} },
  async del(k){ try{ const d = await this.abrir(); await new Promise((ok, er) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = ok; t.onerror = () => er(t.error); }); }catch(e){} }
};

const novoId = () => Math.random().toString(16).slice(2, 10).padEnd(8, '0');
function otimista(aba, l){
  const arr = DB[aba] || (DB[aba] = []), i = arr.findIndex(x => x.id === l.id), base = i >= 0 ? arr[i] : {}, r = Object.assign({}, base, l), eu = EU || {};
  if(aba === 'Atividades' || aba === 'RotinaRegs'){ if(!(eu.perfil === 'admin' && l.email)){ r.email = eu.email; r.nome = eu.nome; } }
  if(aba === 'Reunioes' && !base.email){ r.email = eu.email; r.responsavel = eu.nome; r.criadoEm = new Date().toISOString().slice(0, 16).replace('T', ' '); }
  if(aba === 'InspCampo' && !base.inspetorEmail){ r.inspetorEmail = eu.email; r.inspetor = eu.nome; }
  if(i >= 0) arr[i] = r; else arr.push(r);
}
function enfileirar(acao, extra){
  extra = JSON.parse(JSON.stringify(extra)); let ret;
  if(acao === 'upload'){
    const tmp = 'tmp_' + novoId() + novoId(); extra._tmp = tmp; OUT.q.push({acao, extra, t:Date.now()}); ret = {id:tmp, nome:extra.nome};
  } else if(acao === 'salvar'){
    const aba = extra.aba, l = extra.linha; if(!l.id) l.id = novoId();
    const novo = !(DB[aba] || []).some(x => x.id === l.id); otimista(aba, l);
    const ex = OUT.q.find(o => o.acao === 'salvar' && o.extra.aba === aba && o.extra.linha.id === l.id && !o.enviando);
    if(ex) ex.extra.linha = Object.assign({}, ex.extra.linha, l); else OUT.q.push({acao, extra, novo, t:Date.now()});
    ret = l.id;
  } else if(acao === 'excluir'){
    const aba = extra.aba, id = extra.id; DB[aba] = (DB[aba] || []).filter(x => x.id !== id);
    const i = OUT.q.findIndex(o => o.acao === 'salvar' && o.extra.aba === aba && o.extra.linha.id === id && !o.enviando);
    if(i >= 0){ const era = OUT.q[i]; OUT.q.splice(i, 1); if(!era.novo) OUT.q.push({acao, extra, t:Date.now()}); }
    else OUT.q.push({acao, extra, t:Date.now()});
    ret = true;
  } else {   // salvarLote
    ret = (extra.linhas || []).map(l => { if(!l.id) l.id = novoId(); otimista(extra.aba, l); return l.id; });
    OUT.q.push({acao, extra, t:Date.now()});
  }
  persistir(); pintarSync(); fluxo();
  return Promise.resolve(ret);
}
async function api(acao, extra = {}){
  if(FILA_ON && FILA_ACOES.indexOf(acao) >= 0) return enfileirar(acao, extra);
  return apiRaw(acao, extra);
}
function remapTmp(ex){
  const fix = l => { Object.keys(l || {}).forEach(k => { const v = l[k]; if(typeof v === 'string' && v.indexOf('tmp_') >= 0){ l[k] = v.split(';').map(p => { if(p.indexOf('tmp_') !== 0) return p; if(OUT.map[p]) return OUT.map[p]; throw new Error('O anexo deste registro não foi enviado. Anexe de novo.'); }).join(';'); } }); };
  if(ex.linha) fix(ex.linha); (ex.linhas || []).forEach(fix);
}
function fluxo(){
  if(!FLUXO_P) FLUXO_P = fluxoReal().finally(() => { FLUXO_P = null; });
  return FLUXO_P;
}
async function fluxoReal(){
  if(!TOKEN) return;
  pintarSync();
  while(OUT.q.length){
    if(navigator.onLine === false){ OUT.online = false; break; }
    const o = OUT.q[0]; o.enviando = true;
    try{
      const ex = JSON.parse(JSON.stringify(o.extra)); remapTmp(ex);
      if(o.acao === 'upload'){ const tmp = ex._tmp; delete ex._tmp; const r = await apiRaw('upload', ex); OUT.map[tmp] = r.id; }
      else await apiRaw(o.acao, ex);
      OUT.q.shift(); OUT.online = true;
    }catch(e){
      o.enviando = false;
      if(e.rede){ OUT.online = false; break; }
      if(e.sessao) break;
      OUT.q.shift(); OUT.falhas.push({acao:o.acao, aba:o.extra.aba || '', resumo:resumoOp(o), erro:e.message, extra:o.extra, novo:o.novo, t:o.t});
    }
    persistir(); pintarSync();
  }
  persistir(); pintarSync();
  if(!OUT.q.length && OUT.online) atualizarFundo();
}
function resumoOp(o){
  const l = o.extra.linha || (o.extra.linhas && o.extra.linhas[0]) || {};
  const nome = l.titulo || l.achado || l.tarefa || l.tipo || l.nome || l.empresa || l.doc || o.extra.id || '';
  return (o.acao === 'excluir' ? 'Excluir ' : o.acao === 'upload' ? 'Anexo ' : '') + (o.extra.aba || '') + (nome ? ': ' + String(nome).slice(0, 60) : '') + (l.data ? ' • ' + brData(l.data) : '');
}
async function atualizarFundo(){

    const d = await apiRaw('tudo'); if(OUT.q.length) return;
    const js = JSON.stringify(d); if(js === ULT) return; ULT = js;
    aplicarDados(d); OUT.online = true; persistir();

}

function pintarSync(){
  const el = document.getElementById('sync'); if(!el) return;
  const n = OUT.q.length, f = OUT.falhas.length;
  let t = '', bg = '';
  if(f){ t = '⚠ ' + f + ' não sincronizou'; bg = '#c62828'; }
  else if(!OUT.online || navigator.onLine === false){ t = '📴 Sem internet' + (n ? ' • ' + n + ' salvo(s) no aparelho' : ''); bg = '#b26a00'; }
  else if(n){ t = '⟳ Enviando ' + n + '…'; bg = '#2a6f97'; }

}

const Z = () => ({vt:0,dss:0,pit:0,acoes:0,insp:0,pt:0,apr:0,nv:0,ne:0,urg:0,pts:0,hht:0,qa:0,inc:0,acSem:0,acCpt:0,fat:0,dias:0,desvA:0,desvT:0});
const add = (a,b) => { Object.keys(b).forEach(k => a[k] = (a[k]||0) + b[k]); return a; };
const CH = ['vt','dss','pit','acoes','insp','pt','apr','nv','ne','hht'];
function statsObra(ob, mes){
  const s = Z();
  DB.Indicadores.forEach(i => {
    if(i.mes !== mes || i.obra !== ob) return;
    CH.forEach(k => s[k] += num(i[k]));
    s.qa += num(i.qaX); s.inc += num(i.incX); s.acSem += num(i.acSemX); s.acCpt += num(i.acCptX);
    s.desvA += num(i.desvAX); s.desvT += num(i.desvTX);
  });
  DB.Ocorrencias.forEach(o => {
    if(o.data.slice(0,7) !== mes || o.obra !== ob) return;
    const t = o.tipo;
    if(t==='Quase-acidente') s.qa++;
    else if(t==='Incidente') s.inc++;
    else if(t==='Acidente sem afastamento') s.acSem++;
    else if(t==='Acidente com afastamento'){ s.acCpt++; s.dias += num(o.diasPerdidos); }
    else if(t==='Fatal'){ s.fat++; s.dias += num(o.diasPerdidos); }
  });
  const lt = new Set(); (DB.InspCampo || []).forEach(x => { if(x.obra === ob && !x.origem && String(x.data).slice(0,7) === mes) lt.add(x.lote); }); s.insp += lt.size;
  (DB.Atividades || []).forEach(x => {
    if(x.obra !== ob || String(x.data).slice(0,7) !== mes) return;
    const k = ATIV_K[x.tipo]; if(k) s[k] += num(x.qtd);
  });
  desvios().forEach(d => {
    if(d.data.slice(0,7) !== mes || d.obra !== ob) return;
    s.desvA++; if(d.status === 'Concluído') s.desvT++;
  });
  return s;
}

function terc(obras){
  const r = {aprov:0,ress:0,rep:0,aguard:0}, emp = new Set();

    if(s==='Aprovado') r.aprov += q;
    else if(s==='Aprovado com ressalva') r.ress += q;
    else if(s==='Reprovado') r.rep += q;

    if(t.empresa) emp.add(t.empresa);
  });

  return r;
}

const dUrl = r => `data:${r.mime};base64,${r.b64}`;

function lerDataURL(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('Não foi possível ler o arquivo.'));
    fr.onload = () => res(fr.result);
    fr.readAsDataURL(file);
  });
}
async function comprimir(file){
  const src = await lerDataURL(file);
  return new Promise((res, rej) => {
    const im = new Image();
    im.onerror = () => rej(new Error('Arquivo de imagem inválido.'));
    im.onload = () => {
      const k = Math.min(1, FOTO_MAX / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.75));
    };
    im.src = src;
  });
}
async function obterArq(id){
  if(OUT.map[id]) id = OUT.map[id];
  if(String(id).indexOf('tmp_') === 0){ const o = OUT.q.find(x => x.acao === 'upload' && x.extra._tmp === id); if(o) return {nome:o.extra.nome, mime:o.extra.mime, b64:o.extra.b64}; throw new Error('Arquivo ainda não enviado.'); }
  if(!FOTOS[id]) FOTOS[id] = await api('arquivo', {id});
  return FOTOS[id];
}
async function onFoto(inp){
  const k = inp.dataset.foto, f = inp.files[0]; if(!f) return;
  try{
    const d = await comprimir(f); PEND[k] = d;
    $('#fp-' + k).innerHTML = `<img src="${d}" alt="Pré-visualização">`;
  }catch(err){ toast(err.message, true); inp.value = ''; }
}
async function onArq(inp){
  const f = inp.files[0]; if(!f) return;
  if(f.size > ARQ_MAX){ toast('O arquivo passa de 8 MB. Reduza o tamanho e tente de novo.', true); inp.value = ''; return; }
  try{
    const d = await lerDataURL(f);
    PENDARQ.arquivoId = {nome:f.name, mime:f.type || 'application/octet-stream', b64:d.split(',')[1]};
    $('#fp-arq').textContent = 'Novo arquivo: ' + f.name + ' (será enviado ao salvar)';
  }catch(err){ toast(err.message, true); }
}
function miniaturas(){
  document.querySelectorAll('#modal [data-fk]').forEach(async el => {
    const k = el.dataset.fk, id = el.querySelector('input[name="' + k + '"]').value;
    if(!id) return;
    const p = document.getElementById('fp-' + k);
    try{ const r = await obterArq(id); if(p && !PEND[k]) p.innerHTML = `<img src="${dUrl(r)}" alt="Foto atual">`; }
    catch(e){ if(p) p.textContent = 'Foto anexada (não foi possível carregar a prévia)'; }
  });
}
function abrirFotos(aba, id){
  const m = MOD[aba], r = DB[aba].find(x => x.id === id); if(!r) return;
  const itens = m.fotos.filter(f => r[f.k]);
  $('#modal').innerHTML = `<div class="box wide-box"><h3>Fotos — ${esc(m.sing)}</h3><div class="gal">${itens.map(f => `<figure><div class="gimg" id="g-${f.k}">Carregando…</div><figcaption>${esc(f.l)}</figcaption></figure>`).join('')}</div><div class="acts"><button class="btn" data-act="fechar">Fechar</button></div></div>`;
  $('#modal').classList.remove('hidden');
  itens.forEach(async f => {
    const el = document.getElementById('g-' + f.k);
    try{ const x = await obterArq(r[f.k]); if(el) el.innerHTML = `<img src="${dUrl(x)}" alt="${esc(f.l)}">`; }
    catch(e){ if(el) el.textContent = 'Não foi possível carregar a foto.'; }
  });
}
async function baixarArq(id){
  const r = await obterArq(id);
  const bytes = Uint8Array.from(atob(r.b64), c => c.charCodeAt(0));
  const url = URL.createObjectURL(new Blob([bytes], {type:r.mime}));
  const a = document.createElement('a');
  a.href = url; a.download = r.nome;
  if(/pdf|image/.test(r.mime)) a.target = '_blank';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
function campoEspecial(c, v, row){
  if(c.t === 'hidden') return `<input type="hidden" name="${c.k}" value="${esc(v)}">`;
  if(c.t === 'foto'){
    return `<div class="wide foto" data-fk="${c.k}"><span class="flab">${esc(c.l)}</span>
      <div class="fprev" id="fp-${c.k}">${v ? 'Foto anexada (carregando…)' : 'Sem foto'}</div>
      <input type="hidden" name="${c.k}" value="${esc(v)}">
      <div class="facts"><input type="file" id="ff-${c.k}" data-foto="${c.k}" accept="image/*"><button type="button" class="btn ghost sm" data-act="foto-rem" data-k="${c.k}">Remover</button></div></div>`;
  }
  if(c.t === 'arquivo'){
    const nome = row && row.arquivoNome ? row.arquivoNome : '';
    return `<div class="wide foto"><span class="flab">${esc(c.l)}</span>
      <div class="fprev" id="fp-arq">${v ? 'Arquivo atual: ' + esc(nome || 'arquivo anexado') : 'Nenhum arquivo anexado'}</div>
      <input type="hidden" name="arquivoId" value="${esc(v)}"><input type="hidden" name="arquivoNome" value="${esc(nome)}">
      <div class="facts"><input type="file" id="fa-arq" data-arq="1" accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png"><button type="button" class="btn ghost sm" data-act="arq-rem">Remover arquivo</button></div></div>`;
  }
  if(c.t === 'abas'){
    const sel = String(v || '').split(';').filter(Boolean), pad = !sel.length;
    const PADRAO = ['dash','ocor','lanc','insp','reu','rot','terc','func','adv','s5','desv','bib','ia','norm','cur','prog'];
    const ck = (k, l) => `<label class="chk"><input type="checkbox" name="aba_chk" value="${k}" ${(pad ? PADRAO.includes(k) : sel.includes(k)) ? 'checked' : ''}> ${esc(l)}</label>`;
    const menu = NAVS.filter(n => !['adm','tst','minha','sst'].includes(n[0])).map(n => ck(n[0], n[1])).join('');
    const sst = HUBS.sst.map(x => ck(x[0], x[1] + (HUB_ADMIN[x[0]] ? ' (só consulta)' : ''))).join('');
    return `<div class="wide"><span style="font-weight:600">${esc(c.l)}</span><p class="cont" style="margin:4px 0">Vale para os perfis <b>editor (TST)</b> e <b>leitor</b>. O admin vê tudo; <b>administrativo</b> vê só Funcionários Machine e <b>gerencia</b> só Indicadores, sem depender destas marcações.</p>
      <p style="margin:6px 0 2px;font-weight:600">Menu</p><div class="chkgrid">${menu}</div><p style="margin:8px 0 2px;font-weight:600">Documentos SST / Obras</p><div class="chkgrid">${sst}</div></div>`;
  }
  if(c.t === 'obras'){
    const sel = String(v || '').split(/[;,]/).map(x => x.trim()).filter(Boolean);
    const ops = (DB.Obras || []).filter(o => o.ativo !== 'Não').map(o => `<label class="chk"><input type="checkbox" name="obra_chk" value="${esc(o.nome)}" ${sel.indexOf(o.nome) >= 0 ? 'checked' : ''}> ${esc(o.nome)}</label>`).join('');
    return `<div class="wide foto"><span class="flab">${esc(c.l)}</span><div class="chkgrid">${ops}</div><p class="cont">Marque uma ou mais obras: o usuário só vê e lança nessas obras. Para o TST é obrigatório marcar. Sem nenhuma marcada = todas as obras (gestor e coordenador).</p></div>`;
  }
  if(c.t === 'pessoa'){
    if(EU.perfil !== 'admin') return `<input type="hidden" name="${c.k}" value="${esc(v || EU.email)}">`;
    const ops = (DB.Equipe || []).filter(u => u.ativo === 'Sim').map(u => `<option value="${esc(u.email)}" ${(v || EU.email) === u.email ? 'selected' : ''}>${esc(u.nome)}${u.cargo ? ' (' + esc(u.cargo) + ')' : ''}</option>`).join('');
    return `<label><span>${esc(c.l)}</span><select name="${c.k}">${ops}</select></label>`;
  }
  if(c.t === 'modelo'){
    const ops = DB.RotinaModelos.filter(m => m.ativo !== 'Não' && !RTIPO[m.tipo] && m.tipo !== 'Inspeção' && (EU.perfil === 'admin' || m.cargo === EU.cargo)).map(m => `<option value="${esc(m.id)}" ${m.id === v ? 'selected' : ''}>${esc(m.cargo)} — ${esc(m.tarefa)}${m.porObra === 'Sim' ? ' (por obra)' : ''}</option>`).join('');
    return `<label class="wide"><span>${esc(c.l)}</span><select name="${c.k}" ${c.req ? 'required' : ''}><option value="">—</option>${ops}</select></label>`;
  }
  if(c.t === 'empresa'){
    const ops = DB.Empresas.slice().sort((a,b) => a.obra.localeCompare(b.obra) || a.nome.localeCompare(b.nome))
      .map(e => `<option value="${esc(e.id)}" ${e.id === v ? 'selected' : ''}>${esc(e.obra)} — ${esc(e.nome)}</option>`).join('');
    return `<label class="wide"><span>${esc(c.l)}</span><select name="${c.k}" ${c.req ? 'required' : ''}><option value="">—</option>${ops}</select></label>`;
  }
  if(c.t === 'func'){
    const ops = DB.Funcionarios.filter(f => f.status !== 'Desligado' || f.id === v)
      .sort((a,b) => a.nome.localeCompare(b.nome))
      .map(f => `<option value="${esc(f.id)}" ${f.id === v ? 'selected' : ''}>${esc(f.nome)}${f.matricula ? ' (' + esc(f.matricula) + ')' : ''}</option>`).join('');
    return `<label><span>${esc(c.l)}</span><select name="${c.k}" ${c.req ? 'required' : ''}><option value="">—</option>${ops}</select></label>`;
  }
  return null;
}

function md(t){
  let h = '', lst = '';
  const fecha = () => { if(lst){ h += `</${lst}>`; lst = ''; } };
  esc(t).split('\n').forEach(l => {
    let m;
    if((m = l.match(/^#{1,4}\s+(.*)/))){ fecha(); h += `<h4>${inl(m[1])}</h4>`; }
    else if((m = l.match(/^\s*[-*•]\s+(.*)/))){ if(lst !== 'ul'){ fecha(); h += '<ul>'; lst = 'ul'; } h += `<li>${inl(m[1])}</li>`; }
    else if((m = l.match(/^\s*\d+[.)]\s+(.*)/))){ if(lst !== 'ol'){ fecha(); h += '<ol>'; lst = 'ol'; } h += `<li>${inl(m[1])}</li>`; }
    else if(!l.trim()) fecha();
    else { fecha(); h += `<p>${inl(l)}</p>`; }
  });
  fecha(); return h;
}

const docAvalOk = d => d.status === 'Aprovado' || d.status === 'Aprovado com ressalva' || d.status === 'Reprovado';
function docsResumo(obras, mes){
  const tr = {}; DB.Terceiros.forEach(t => { if(obras.indexOf(t.obra) >= 0 && t.situacaoObra !== 'Desmobilizado') tr[t.id] = t; });
  const em = {}; DB.Empresas.forEach(e => { if(obras.indexOf(e.obra) >= 0 && e.status !== 'Desligada') em[e.id] = e; });
  const r = {total:0, aval:0, aprov:0, ress:0, rep:0, venc:0, pend:0, noMes:0, trabAval:0, trabTot:Object.keys(tr).length, empAval:0, empTot:Object.keys(em).length, porObra:{}};
  obras.forEach(o => r.porObra[o] = {total:0, aval:0, aprov:0, ress:0, rep:0, pend:0});
  const trComDoc = new Set(), emComDoc = new Set();
  const cont = (d, ob, tipo, id) => {
    r.total++; const po = r.porObra[ob] || (r.porObra[ob] = {total:0, aval:0, aprov:0, ress:0, rep:0, pend:0}); po.total++;
    if(docAvalOk(d)){
      r.aval++; po.aval++;
      if(d.status === 'Aprovado'){ r.aprov++; po.aprov++; } else if(d.status === 'Aprovado com ressalva'){ r.ress++; po.ress++; } else { r.rep++; po.rep++; }
      if(String(d.dataAvaliacao).slice(0,7) === mes) r.noMes++;
      (tipo === 't' ? trComDoc : emComDoc).add(id);
    } else if(d.status !== 'Não se aplica'){ r.pend++; po.pend++; }
    if(docEstado(d) === 'Vencido') r.venc++;
  };
  DB.TercDocs.forEach(d => { const t = tr[d.trabId]; if(t) cont(d, t.obra, 't', t.id); });
  DB.DocsEmpresa.forEach(d => { const e = em[d.empresaId]; if(e) cont(d, e.obra, 'e', e.id); });
  r.trabAval = trComDoc.size; r.empAval = emComDoc.size;
  return r;
}

/* ---- avaliação automática pela rotina (v9) ---- */
function autoAval(u, mes){
  const eu = {email:u.email, cargo:u.cargo, obras:u.obras}, rot = rotinaMes(eu, mes), at = rotinaAtrasos(eu).length;
  const f = u.funcId ? funcDe(u.funcId) : null, nm = f ? f.nome.trim().toLowerCase() : '';
  const dv = nm ? desvios().filter(d => (d.who || '').trim().toLowerCase() === nm) : [];
  const resDv = dv.length ? dv.filter(d => d.status === 'Concluído').length / dv.length * 100 : null;
  const base = rot === null ? null : rot * 0.6 + Math.max(0, 100 - at * 5) * 0.4;
  return {u, rot, at, resDv, dvAt:dv.filter(atrasado).length, nota:base};
}
function autoAvalHTML(){
  const mes = F.mes || mesISO();
  const tsts = (DB.Equipe || []).filter(u => u.ativo === 'Sim' && u.cargo === 'TST');
  if(!tsts.length) return '';
  const l = tsts.map(u => autoAval(u, mes));
  return `<h2>Avaliação automática pela rotina — ${esc(nomeMes(mes))}</h2>
  <div class="nota">O que não foi feito na rotina fica <b>atrasado e acumula</b> para os dias e meses seguintes, e entra aqui. Nota automática = 60% do cumprimento da rotina do mês + 40% (100 menos 5 pontos por pendência atrasada). O rascunho preenche os critérios que o sistema consegue medir; os demais (conhecimento, documentação, comunicação) ficam para você.</div>
  <div class="card"><table><thead><tr><th>TST</th><th>Rotina cumprida</th><th>Pendências atrasadas</th><th>Desvios resolvidos / atrasados</th><th>Nota automática</th><th></th></tr></thead><tbody>${l.map(x => {
    const ja = DB.AvaliacoesTST.some(a => a.funcId === x.u.funcId && a.mes === mes && /Rotina automática/.test(a.metas || ''));
    return `<tr><td><b>${esc(x.u.nome)}</b></td><td>${x.rot === null ? '—' : chip(fmtP(x.rot), clsP(x.rot))}</td><td>${x.at ? chip(String(x.at), 'bad') : chip('0', 'ok')}</td><td>${x.resDv === null ? '—' : fmtP(x.resDv)} / ${x.dvAt}</td><td>${x.nota === null ? '—' : chip(fmtP(x.nota), clsP(x.nota))}</td>

}

   V4: Terceiros completo (empresas, trabalhadores, documentos, datas e indicador mensal)

const DOC_ST = ['Aprovado','Aprovado com ressalva','Reprovado','Aguardando','Não se aplica','Pendente'];
const DVS = [['ASO','aso'],['Treinamento NR-18','nr18'],['Treinamento NR-35','nr35'],['Treinamento NR-12','nr12'],['Treinamento NR-06','nr06']];
const DOCS_TRAB = ['CNH / Documento de identificação','Ficha de registro','CTPS / eSocial / Contrato','ASO','Ordem de serviço (OS)','Ficha de EPI','Treinamento NR-06','Treinamento NR-12','Treinamento NR-18','Treinamento NR-35'];
const DOCS_EMP = ['CNPJ','Alvará de Funcionamento','AVCB','Licenciamento Ambiental','IBAMA / CTF','PGR','PCMSO','Certidões'];
const INTEGR = ['Realizado','Agendar','Pendente'];
const OKS = ['Aprovado','Aprovado com ressalva','Não se aplica','A vencer'];
const corDS = s => s === 'Aprovado' ? 'ok' : (s === 'Aprovado com ressalva' || s === 'A vencer') ? 'warn' : (s === 'Reprovado' || s === 'Vencido') ? 'bad' : s === 'Aguardando' ? 'info' : '';
let TSUB = 'resumo', TF = {q:'', obra:'', emp:'', st:'', sit:'', vinc:''}, TFICHA = null, TSEL = new Set(), TLOTE = null;

const empDe = id => DB.Empresas.find(e => e.id === id);
const empNome = t => { const e = empDe(t.empresaId); return e ? e.nome : (t.empresa || '—'); };
const docEstado = d => {
  if(!d) return 'Pendente';
  if((d.status === 'Aprovado' || d.status === 'Aprovado com ressalva') && d.validade){
    const n = diasEntre(hojeISO(), d.validade);
    if(n < 0) return 'Vencido';
    if(n <= 30) return 'A vencer';
  }
  return d.status || 'Pendente';
};
const docMap = (aba, chave, id) => { const m = {}; DB[aba].forEach(d => { if(d[chave] === id) m[d.doc] = d; }); return m; };
const listaDocsTrab = t => { const m = docMap('TercDocs','trabId',t.id); return DOCS_TRAB.concat(Object.keys(m).filter(k => DOCS_TRAB.indexOf(k) < 0)); };
function tercPend(t){
  const m = docMap('TercDocs','trabId',t.id), p = [];
  listaDocsTrab(t).forEach(k => { const e = docEstado(m[k]); if(OKS.indexOf(e) < 0) p.push({doc:k, e}); });
  if(t.integracao !== 'Realizado') p.push({doc:'Integração Machine', e:t.integracao || 'Pendente'});
  return p;
}
const sugest = t => { const p = tercPend(t); return p.length ? ['Pendências (' + p.length + ')', 'warn', p] : ['Documentação completa', 'ok', p]; };
function empPend(e){
  const m = docMap('DocsEmpresa','empresaId',e.id);
  return Object.keys(m).filter(k => OKS.indexOf(docEstado(m[k])) < 0).map(k => ({doc:k, e:docEstado(m[k])}));
}
const refTrab = t => t.dataAvaliacao || t.dataLiberacao || t.dataMobilizacao || '';
const ehAprov = s => s === 'Aprovado' || s === 'Aprovado com ressalva';
function tercMes(mes, obras){
  const l = DB.Terceiros.filter(t => obras.indexOf(t.obra) >= 0 && String(refTrab(t)).slice(0,7) === mes);
  const r = {n:l.length, aprov:0, ress:0, rep:0, aguard:0, semData:0, dias:[],
    emp: DB.Empresas.filter(e => obras.indexOf(e.obra) >= 0 && e.tipo !== 'Própria' && String(e.mobilizacao).slice(0,7) === mes).length};
  l.forEach(t => {
    if(t.status === 'Aprovado') r.aprov++; else if(t.status === 'Aprovado com ressalva') r.ress++;
    else if(t.status === 'Reprovado') r.rep++; else r.aguard++;
    if(!t.dataAvaliacao && !t.dataLiberacao) r.semData++;
    if(t.dataMobilizacao && t.dataLiberacao && ehAprov(t.status)){ const d = diasEntre(t.dataMobilizacao, t.dataLiberacao); if(d >= 0) r.dias.push(d); }
  });
  r.aval = r.aprov + r.ress + r.rep;
  r.conf = pct(r.aprov + r.ress, r.aval);

async function confSalvar(f){

function rotinaItens(u, dia, regs){

function rotinaMes(u, mes){
  const hoje = hojeISO(), dias = []; let d = mes + '-01';
  while(d.slice(0,7) === mes && d <= hoje){ if(ehUtil(d)) dias.push(d); d = addDias(d, 1); }
  let ex = 0, fe = 0; const semanas = {};
  dias.forEach(dia => {
    rotinaItens(u, dia, DB.RotinaRegs).filter(x => x.diaria).forEach(x => { ex += x.meta; fe += Math.min(x.feito, x.meta); });

  });
  Object.values(semanas).forEach(dia => rotinaItens(u, dia, DB.RotinaRegs).filter(x => !x.diaria && !x.quinz).forEach(x => { ex += x.meta; fe += Math.min(x.feito, x.meta); }));

function lerItemInsp(b, k, data){
  const g = n => (b.querySelector('[name="' + n + '"]') || {}).value || '', chk = n => !!(b.querySelector('[name="' + n + '"]') || {}).checked;
  const tp = g('tipo') || 'Desvio', n1 = k + 1, base = {i:b.dataset.i, tipo:tp}, opcAcao = tp === '5S' || tp === 'Lançamento livre';
  const acao = () => {
    if(!g('prazo')) throw new Error('Informe o prazo de solução do item ' + n1 + '.');
    if(g('prazo') < data) throw new Error('O prazo do item ' + n1 + ' não pode ser anterior à data da vistoria.');
    if(opcAcao){ if(g('porque').trim().length < 3) throw new Error('Item ' + n1 + ': escreva o motivo do desvio.'); if(g('solucaoProposta').trim().length < 3) throw new Error('Item ' + n1 + ': escreva o que deve ser feito.'); }
    return {porque:g('porque'), risco:g('risco') || 'Médio', nr:g('nr'), responsavel:g('responsavel'), prazo:g('prazo'), solucaoProposta:g('solucaoProposta').trim()};
  };
  const fechado = ach => Object.assign({}, base, {achado:ach, porque:'', risco:'Baixo', nr:'', responsavel:'', prazo:data, fechado:1, semAcao:1});
  if(tp === '5S'){
    if(g('area').trim().length < 2) throw new Error('Informe a área auditada no item ' + n1 + ' (5S).');
    SENSOS.forEach(s => { if(!/^[0-5]$/.test(g(s))) throw new Error('Item ' + n1 + ': escolha a nota de 0 a 5 para cada senso do 5S.'); });
    const ach = g('achado').trim() || ('Auditoria 5S — ' + g('area').trim()), notas = Object.fromEntries(SENSOS.map(s => [s, g(s)]));
    return chk('requerAcao') ? Object.assign({}, base, {achado:ach, area:g('area').trim(), requerAcao:'Sim'}, notas, acao()) : Object.assign(fechado(ach), {area:g('area').trim()}, notas);
  }
  const ach = g('achado').trim();
  if(ach.length < 3) throw new Error('Descreva o que foi encontrado no item ' + n1 + '.');
  if(tp === 'Boa prática') return fechado(ach);
  if(tp === 'Lançamento livre') return chk('requerAcao') ? Object.assign({}, base, {achado:ach, requerAcao:'Sim'}, acao()) : fechado(ach);
  if(tp === 'Ver e agir' && !b.dataset.edit){
    const ac = g('acaoTomada').trim(); if(ac.length < 3) throw new Error('Item ' + n1 + ': descreva o que você fez.');
    if(g('agirSit') === 'Finalizado') return Object.assign({}, base, {achado:ach, porque:'', risco:g('risco') || 'Médio', nr:'', responsavel:EU.nome, prazo:data, solucao:ac, fechado:1});
    return Object.assign({}, base, {achado:ach, solucao:'Ação inicial: ' + ac}, acao());
  }
  return Object.assign({}, base, {achado:ach}, acao());
}
async function salvarInspecao(f){

        btn.textContent = 'Salvando ' + (feitos + 1) + '/' + itens.length + '…';

        feitos++;

  }catch(err){ toast(err.message, true); btn.disabled = false; btn.textContent = 'Salvar vistoria'; }

function ieDados(){
  const g = id => (document.getElementById(id).value || '').trim(), lim = v => v.split(/[,;\s]+/).filter(Boolean).join(';');

async function ieCopiar(msg){ try{ await navigator.clipboard.writeText(msg); return true; }catch(e){ const ta = document.getElementById('ie-msg'); ta.select(); try{ return document.execCommand('copy'); }catch(x){ return false; } } }
async function ieAbrir(){
  const d = ieDados(); if(!d.para){ toast('Informe o e-mail do gestor.', true); return; }
  let corpo = d.msg, longo = false;
  const mk = b => 'mailto:' + d.para + '?subject=' + encodeURIComponent(d.as) + (d.cc ? '&cc=' + d.cc : '') + '&body=' + encodeURIComponent(b);
  if(mk(corpo).length > 1900){ longo = true; await ieCopiar(d.msg); corpo = 'Cole aqui a mensagem (ela foi copiada automaticamente).'; }

function inspGeralGerar(f){
  const fd = new FormData(f), obra = fd.get('obra'), rs = fd.get('resp'), de = fd.get('de'), ate = fd.get('ate'), sit = fd.get('sit'), hoje = hojeISO();
  const its = (DB.InspCampo || []).filter(x => (!obra || x.obra === obra) && (!rs || respNorm(x.responsavel) === respNorm(rs)) && (!de || x.data >= de) && (!ate || x.data <= ate)
    && (sit === 'todos' || (sit === 'pend' ? x.status !== 'Concluída' : x.status === 'Concluída')));
  if(!its.length){ toast('Nenhum item encontrado com esses filtros.', true); return; }
  const grupos = {}; its.forEach(x => { const r = (x.responsavel || '').trim() || '(sem responsável)'; (grupos[r] = grupos[r] || []).push(x); });
  const pend = its.filter(x => x.status !== 'Concluída'), venc = pend.filter(inspVencido), conc = its.filter(x => x.status === 'Concluída');
  const secs = Object.keys(grupos).sort().map(r => {
    const g = grupos[r].slice().sort((a, b) => (a.status === 'Concluída') - (b.status === 'Concluída') || a.prazo.localeCompare(b.prazo));
    const lin = g.map(x => { const d = diasEntre(x.prazo, hoje), feito = x.status === 'Concluída';
      return `<tr><td>${feito ? 'Concluída' : esc(x.status) + (d > 0 ? '<br><b>' + d + ' dia(s) de atraso</b>' : '')}</td><td>${esc(brData(x.data))}<br>${esc(x.obra)}</td><td><b>${esc(x.achado)}</b>${x.nr ? '<br>' + esc(x.nr) : ''}${x.local ? '<br>' + esc(x.local) : ''}</td><td>${esc(x.risco)}</td><td>${esc(brData(x.prazo))}</td>
        <td>${feito ? esc(brData(x.dataSolucao)) + '<br>' + esc(x.resolvidoPor || '') + '<br>' + esc(x.solucao) : (x.solucao ? esc(x.solucao) : '—')}</td><td>${esc(x.inspetor)}</td></tr>`; }).join('');
    const a = g.filter(x => x.status !== 'Concluída').length;
    return sec(`${r} — ${g.length} item(ns), ${g.length - a} concluído(s), ${a} pendente(s)`, `<table class="doc-t2"><thead><tr><th>Situação</th><th>Inspeção</th><th>Achado</th><th>Risco</th><th>Prazo</th><th>Solução (data, quem, o que foi feito)</th><th>Inspetor</th></tr></thead><tbody>${lin}</tbody></table>`);
  }).join('');
  const html = docBase('Relatório geral de inspeções de campo', 'Inspeção de campo',
    kv([['Obra', obra || 'Todas'], ['Responsável', rs || 'Todos'], ['Período', (de ? brData(de) : 'início') + ' a ' + (ate ? brData(ate) : brData(hoje))], ['Emitido em', brData(hoje)],
        ['Itens', String(its.length)], ['Concluídos', String(conc.length)], ['Pendentes', String(pend.length)], ['Pendentes com prazo vencido', String(venc.length)]])
    + secs + assin(['Inspetor (TST)', 'Gestor da obra']));
  fechar(); imprimirDoc(html);
}

/* ---------- pendências acumuladas da rotina ---------- */
const ROT_JANELA = 14;
function rotinaAtrasos(u){
  const hoje = hojeISO(), out = [], semAtual = segundaDe(hoje), semanas = {};
  for(let k = 1; k <= ROT_JANELA; k++){
    const dd = addDias(hoje, -k); if(!ehUtil(dd)) continue;
    rotinaItens(u, dd, DB.RotinaRegs).filter(x => x.diaria && !x.ok).forEach(x => out.push(Object.assign({dia:dd}, x)));
    const sg = segundaDe(dd); if(sg < semAtual) semanas[sg] = 1;
  }
  Object.keys(semanas).forEach(sg => rotinaItens(u, sg, DB.RotinaRegs).filter(x => !x.diaria && !x.quinz && !x.ok).forEach(x => out.push(Object.assign({dia:sg, semana:true}, x))));
  const qz = {}; for(let k = 1; k <= ROT_JANELA; k++){ const dd = addDias(hoje, -k), q = quinzenaDe(dd); if(q[1] < hoje) qz[q[0]] = 1; }
  Object.keys(qz).forEach(de => rotinaItens(u, de, DB.RotinaRegs).filter(x => x.quinz && !x.ok).forEach(x => out.push(Object.assign({dia:de}, x))));
  return out.sort((a, b) => b.dia.localeCompare(a.dia));
}

function iaCamposDe(root, excl){
  const out = [];
  root.querySelectorAll('input[name],select[name],textarea[name]').forEach(el => {
    if(['hidden','file','password','checkbox','radio'].indexOf(el.type) >= 0 || el.closest('.iabox') || (excl || []).indexOf(el.name) >= 0 || /^dv_/.test(el.name)) return;
    const lab = el.closest('label'), sp = lab && lab.querySelector('span');
    const c = {k:el.name, l:(sp ? sp.textContent : el.name).slice(0,60), t:el.type === 'date' ? 'date' : el.tagName === 'SELECT' ? 'select' : el.type === 'number' ? 'num' : 'text', v:el.value};
    if(el.tagName === 'SELECT'){ c.opts = [...el.options].map(o => o.value).filter(Boolean); if(c.opts.length > 25) return; }
    out.push(c);
  });
  return out;
}
function iaAplicar(root, vals, forcar){
  let n = 0;
  Object.keys(vals || {}).forEach(k => {
    const el = root.querySelector('[name="' + k + '"]'); if(!el || (el.value && !el.dataset.iaOk && (forcar || []).indexOf(k) < 0)) return;
    if(el.tagName === 'SELECT' && ![...el.options].some(o => o.value === vals[k])) return;
    el.value = vals[k]; el.dataset.iaOk = '1'; el.classList.add('iasug'); n++;

  return n;
}

/* ditado por voz (reconhecimento do navegador; não envia áudio ao servidor) */
function ditar(btn){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(REC_ATIVO){ try{ REC_ATIVO.rec.stop(); }catch(e){} return; }
  if(!SR){ toast('Este navegador não tem ditado por voz. Use o microfone do teclado do celular.', true); return; }
  const alvo = btn.dataset.alvo ? document.getElementById(btn.dataset.alvo)
    : (btn.closest('.ip') ? btn.closest('.ip').querySelector('[name="achado"]') : (btn.closest('.iabox') ? btn.closest('.iabox').querySelector('textarea') : null));
  if(!alvo) return;
  const rec = new SR(); rec.lang = 'pt-BR'; rec.continuous = true; rec.interimResults = false;
  const t0 = btn.textContent; btn.textContent = '⏹ Parar'; btn.classList.add('rec');
  rec.onresult = ev => { for(let k = ev.resultIndex; k < ev.results.length; k++) if(ev.results[k].isFinal) alvo.value += (alvo.value && !/\s$/.test(alvo.value) ? ' ' : '') + ev.results[k][0].transcript.trim(); };
  rec.onend = () => { btn.textContent = t0; btn.classList.remove('rec'); REC_ATIVO = null; };
  rec.onerror = () => { btn.textContent = t0; btn.classList.remove('rec'); REC_ATIVO = null; };
  REC_ATIVO = {rec}; rec.start();
}
